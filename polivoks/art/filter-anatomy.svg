<svg class="art-anatomy" viewBox="0 0 1180 470" role="img" aria-labelledby="art-anatomy-t"><title id="art-anatomy-t">Inside the PF-82 filter</title><desc>The control path sums FREQUENCY, CV 1 through the attenuverter, CV 2 and +12 V into U1B, whose feedback transistor Q1 turns current into an exponential Iset for both MC1776 integrators. The audio input and the low-pass feedback meet at U2's input; U2 integrates to the band-pass, U3 to the low-pass; the resonance pot feeds the band-pass back as damping. Buffers and an equal-power mixer give the three outputs. Amber notes mark where a real unit is imperfect.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z" fill="#eeebe4"/></marker></defs><rect class="an-bg" x="0" y="0" width="1180" height="470" rx="14"/><text class="an-head" x="28" y="40">INSIDE THE PF-82 FILTER</text><text class="an-sub" x="28" y="62">After clarionut’s Eurorack Polivoks filter; reference designators from his schematic.</text><text class="an-section" x="28" y="98">CONTROL</text><text class="an-label" x="28" y="126">FREQUENCY</text><text class="an-sub" x="110" y="126">RV1 · R2 180k</text><path class="audio thin" d="M262 122L282 165"/><text class="an-label" x="28" y="160">CV 1</text><text class="an-sub" x="110" y="160">U1A attenuverter · R6 47k</text><path class="audio thin" d="M262 156L282 165"/><text class="an-label" x="28" y="194">CV 2</text><text class="an-sub" x="110" y="194">R3 100k</text><path class="audio thin" d="M262 190L282 165"/><text class="an-label" x="28" y="228">+12 V</text><text class="an-sub" x="110" y="228">R7 100k</text><path class="audio thin" d="M262 224L282 165"/><circle class="art-sum" cx="296" cy="165" r="14"/><text class="an-label" x="296" y="170" text-anchor="middle">Σ</text><text class="an-imp" x="28" y="250">Ripple on +12 V</text><text class="an-imp" x="28" y="266">moves the cutoff</text><path class="audio" d="M296 179V238" marker-end="url(#arrow)"/><rect class="an-box" x="206" y="240" width="180" height="66" rx="8"/><text class="an-label" x="218" y="262">U1B + Q1 (2N3904)</text><text class="an-sub" x="218" y="279">exponential converter</text><text class="an-sub" x="218" y="295">R8 3k: ×2 per 5.9 µA</text><text class="an-imp" x="28" y="336">No temperature compensation:</text><text class="an-imp" x="28" y="352">+1.3 octaves per 10 °C</text><path class="cv" d="M386 273H420V330H770V212" marker-end="url(#arrow)"/><path class="cv" d="M570 330V212" marker-end="url(#arrow)"/><circle class="junction" cx="570" cy="330" r="3.5"/><text class="an-sub" x="440" y="348">Iset through R12 / R15 · the two chips share it unequally</text><text class="an-section" x="440" y="98">CORE</text><text class="an-label" x="430" y="186" text-anchor="end">AUDIO IN</text><text class="an-sub" x="430" y="202" text-anchor="end">RV3 · R4</text><path class="audio" d="M434 190H458" marker-end="url(#arrow)"/><circle class="art-sum" cx="472" cy="190" r="14"/><text class="an-label" x="472" y="195" text-anchor="middle">Σ</text><text class="an-sub" x="492" y="212">÷50</text><path class="audio" d="M486 190H516" marker-end="url(#arrow)"/><path class="art-amp" d="M520 150L520 230L610 190Z"/><text class="an-label" x="530" y="186">U2A</text><text class="an-sub" x="530" y="202">MC1776</text><circle class="junction" cx="650" cy="190" r="3.5"/><text class="an-label" x="652" y="180">BP</text><path class="audio" d="M610 190H716" marker-end="url(#arrow)"/><text class="an-sub" x="668" y="206" text-anchor="middle">÷48</text><path class="art-amp" d="M720 150L720 230L810 190Z"/><text class="an-label" x="730" y="186">U3A</text><text class="an-sub" x="730" y="202">MC1776</text><path class="audio" d="M810 190H850"/><circle class="junction" cx="850" cy="190" r="3.5"/><text class="an-label" x="852" y="180">LP</text><path class="audio" d="M650 190V134H472V172" marker-end="url(#arrow)"/><text class="an-label" x="560" y="126" text-anchor="middle">RV4 RESONANCE</text><path class="audio" d="M850 190V260H472V208" marker-end="url(#arrow)"/><text class="an-sub" x="600" y="254">R10 · LP back to U2</text><text class="an-imp" x="440" y="372">U2A, U3A run open loop: their slew limit is the growl,</text><text class="an-imp" x="440" y="390">and their second pole tips full RESONANCE into oscillation.</text><text class="an-section" x="900" y="98">OUTPUTS</text><path class="audio" d="M650 134V108H896" marker-end="url(#arrow)"/><rect class="an-box" x="900" y="86" width="120" height="40" rx="8"/><text class="an-label" x="912" y="104">×1.61 · U4B</text><text class="an-sub" x="912" y="119">C11 coupling</text><path class="audio" d="M1020 106H1060" marker-end="url(#arrow)"/><text class="an-label" x="1066" y="111">BP OUT</text><path class="audio" d="M850 190H896" marker-end="url(#arrow)"/><rect class="an-box" x="900" y="170" width="120" height="40" rx="8"/><text class="an-label" x="912" y="188">×1.33 · U4A</text><text class="an-sub" x="912" y="203">C12 coupling</text><path class="audio" d="M1020 190H1060" marker-end="url(#arrow)"/><text class="an-label" x="1066" y="195">LP OUT</text><rect class="an-box" x="900" y="250" width="120" height="40" rx="8"/><text class="an-label" x="912" y="268">RV5 · U4C · U4D</text><text class="an-sub" x="912" y="283">equal-power mix</text><text class="an-sub" x="894" y="262" text-anchor="end">BP</text><text class="an-sub" x="894" y="284" text-anchor="end">LP</text><path class="audio" d="M1020 270H1060" marker-end="url(#arrow)"/><text class="an-label" x="1066" y="275">MIX OUT</text><text class="an-imp" x="900" y="318">Buffers clip near ±10.5 V</text><text class="an-imp" x="862" y="240">Integrators stop at the ±11 V rails</text><text class="an-imp" x="28" y="420">Every pot: ±20 % and its end resistance; worn wipers lift for a moment when turned.</text><text class="an-sub" x="28" y="448">White: audio and control voltages · dashed: the Iset current · amber: where a real unit is imperfect.</text></svg>
