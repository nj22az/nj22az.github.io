<svg class="art-flow" viewBox="0 0 1180 250" role="img" aria-labelledby="art-flow-t"><title id="art-flow-t">Signal flow of the Johansson PF-82</title><desc>Audio: VCO 1 and VCO 2 into the mixer, the mixer into the Polivoks filter, the filter into the VCA, then out. Control: the keyboard sets the VCO pitch and, through TRACK, the filter's CV 2; the LFO feeds CV 2; envelope 1 feeds CV 1; envelope 2 opens the VCA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z" fill="#eeebe4"/></marker></defs><a class="sf-block" href="#mod-vco1" data-mod="vco1"><title>1 VCO 1: open the module</title><rect class="sf-box" x="20" y="20" width="150" height="46" rx="8"/><text class="sf-num" x="32" y="40">1</text><text class="sf-title" x="54" y="40">VCO 1</text><text class="sf-sub" x="32" y="57">makes the tone</text></a><a class="sf-block" href="#mod-vco2" data-mod="vco2"><title>2 VCO 2: open the module</title><rect class="sf-box" x="20" y="80" width="150" height="46" rx="8"/><text class="sf-num" x="32" y="100">2</text><text class="sf-title" x="54" y="100">VCO 2</text><text class="sf-sub" x="32" y="117">a second tone</text></a><a class="sf-block" href="#mod-mix" data-mod="mix"><title>3 MIXER: open the module</title><rect class="sf-box" x="240" y="40" width="140" height="66" rx="8"/><text class="sf-num" x="252" y="60">3</text><text class="sf-title" x="274" y="60">MIXER</text><text class="sf-sub" x="252" y="77">blends the tones</text><text class="sf-sub" x="252" y="92">and the noise</text></a><a class="sf-block" href="#mod-flt" data-mod="flt"><title>4 VCF: open the module</title><rect class="sf-box sf-main" x="450" y="18" width="250" height="106" rx="8"/><text class="sf-num" x="462" y="48">4</text><text class="sf-title" x="484" y="48">VCF</text><text class="sf-sub" x="462" y="65">POLIVOKS FILTER</text><text class="sf-sub" x="462" y="80">shapes the tone:</text><text class="sf-sub" x="462" y="95">bright, dark, ringing</text></a><a class="sf-block" href="#mod-amp" data-mod="amp"><title>5 VCA: open the module</title><rect class="sf-box" x="770" y="40" width="140" height="66" rx="8"/><text class="sf-num" x="782" y="60">5</text><text class="sf-title" x="804" y="60">VCA</text><text class="sf-sub" x="782" y="77">sets the loudness</text></a><rect class="sf-box sf-out" x="980" y="48" width="110" height="50" rx="8"/><text class="sf-title" x="995" y="69">OUT</text><text class="sf-sub" x="995" y="86">to your speakers</text><a class="sf-block" href="#mod-voice" data-mod="voice"><title>8 KEYBOARD: open the module</title><rect class="sf-box" x="20" y="188" width="150" height="46" rx="8"/><text class="sf-num" x="32" y="208">8</text><text class="sf-title" x="54" y="208">KEYBOARD</text><text class="sf-sub" x="32" y="225">plays the notes</text></a><a class="sf-block" href="#mod-lfo" data-mod="lfo"><title>7 LFO: open the module</title><rect class="sf-box" x="450" y="188" width="112" height="46" rx="8"/><text class="sf-num" x="462" y="208">7</text><text class="sf-title" x="484" y="208">LFO</text><text class="sf-sub" x="462" y="225">a slow wobble</text></a><a class="sf-block" href="#mod-eg1" data-mod="eg1"><title>6 ENV 1: open the module</title><rect class="sf-box" x="588" y="188" width="112" height="46" rx="8"/><text class="sf-num" x="600" y="208">6</text><text class="sf-title" x="622" y="208">ENV 1</text><text class="sf-sub" x="600" y="225">moves the filter</text></a><a class="sf-block" href="#mod-amp" data-mod="amp"><title>5 ENV 2: open the module</title><rect class="sf-box" x="770" y="188" width="140" height="46" rx="8"/><text class="sf-num" x="782" y="208">5</text><text class="sf-title" x="804" y="208">ENV 2</text><text class="sf-sub" x="782" y="225">shapes the loudness</text></a><path class="audio" d="M170 43H205V64H236" marker-end="url(#arrow)"/><path class="audio" d="M170 103H205V82H236" marker-end="url(#arrow)"/><path class="audio" d="M380 73H446" marker-end="url(#arrow)"/><path class="audio sf-patched" d="M700 73H766" marker-end="url(#arrow)"/><text class="sf-port" id="sf-out" x="733" y="64" text-anchor="middle">LP OUT</text><path class="audio" d="M910 73H976" marker-end="url(#arrow)"/><path class="cv" d="M95 188V130" marker-end="url(#arrow)"/><text class="sf-port" x="103" y="162">PITCH</text><path class="cv" d="M506 188V128" marker-end="url(#arrow)"/><text class="sf-port" x="514" y="162">CV 2</text><path class="cv" d="M644 188V128" marker-end="url(#arrow)"/><text class="sf-port" x="652" y="162">CV 1</text><path class="cv" d="M840 188V110" marker-end="url(#arrow)"/><path class="cv" d="M170 211H420V150H502" marker-end="url(#arrow)"/><circle class="junction" cx="506" cy="150" r="3.5"/><text class="sf-port" x="232" y="204">TRACK → CV 2</text></svg>
