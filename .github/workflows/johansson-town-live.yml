name: Johansson Town live

# Keeps the online game and its web Studio (GitHub Pages, served from main) up to date while they are built on the
# work branch: every push there that touches johansson-town/ (World) or avatar-creator/ (Johansson Studio, which
# imports World's code) is tested, then those two folders (only those) are copied onto main.
# World has no customisation (looks, wardrobes and the home are made in Johansson Studio), and the ?build town builder
# stays off online (src/features.js): the tests below check both before anything is published.
on:
  push:
    branches: ['claude/sjoskolan-youtube-strategy-gofi3o']
    paths: ['johansson-town/**', 'avatar-creator/**', '.github/workflows/johansson-town-live.yml']
  workflow_dispatch:

concurrency:
  group: johansson-town-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The game's tests grew past 20 minutes with the body checks (floor sit, the funny poses, Fujita's Back's
    # moves on every body); a single stuck test is stopped after 15 minutes by npm test's --test-timeout.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: johansson-town
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: World has no customisation, and the town builder is off on the live site
        run: node --test tests/live-features.test.mjs
      - name: Game tests (including a fresh runtime build and portraits)
        run: npm test
      - name: Johansson Studio tests (the web Studio runs on World's code)
        working-directory: .
        run: node --test avatar-creator/tests/*.test.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Copy johansson-town and avatar-creator onto main
        env:
          SOURCE: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898613+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$SOURCE"
          for dir in johansson-town avatar-creator; do
            # Never overwrite changes that reached main some other way: main's folder must be a version the work branch
            # already has (or absent). If not, merge main into the branch first.
            live=$(git rev-parse "HEAD:$dir" 2>/dev/null || true)
            if [ -n "$live" ]; then
              known=no
              for c in $(git rev-list --max-count=1000 "$SOURCE" -- "$dir"); do
                if [ "$(git rev-parse "$c:$dir" 2>/dev/null || true)" = "$live" ]; then known=yes; break; fi
              done
              if [ "$known" != yes ]; then
                echo "::error::main has $dir changes the branch does not have. Merge main into $BRANCH, then push again."
                exit 1
              fi
            fi
            git rm -rq --ignore-unmatch "$dir"
            git checkout "$SOURCE" -- "$dir"
          done
          if git diff --cached --quiet; then echo 'The live game and Studio are already up to date.'; exit 0; fi
          git commit -q -m "Johansson World and Studio live: ${SOURCE::8} from $BRANCH"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5)); git pull --rebase -q origin main
          done
          exit 1
