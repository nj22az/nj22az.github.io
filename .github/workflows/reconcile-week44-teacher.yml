name: Reconcile Week 44 teacher material

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-week44-teacher.yml'
      - 'sjoskolan/verktyg/larare/week44_acceptance.py'
      - 'sjoskolan/verktyg/larare/lararmanus.py'
      - 'sjoskolan/larare/vecka-44.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-week44-teacher
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      LARARLOSEN: ${{ secrets.LARARLOSEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install python-pptx
      - name: Export encrypted audit inputs
        uses: actions/upload-artifact@v4
        with:
          name: week44-protected-audit-inputs
          retention-days: 1
          path: |
            sjoskolan/larare/vecka-44.html
            sjoskolan/larare/filer/v44_*_larare.pptx.enc
            sjoskolan/vecka-44/aktuell/v44_*_elev.pptx
            sjoskolan/verktyg/larare/
            sjoskolan/innehall/
      - name: Inspect existing encrypted presentations
        if: env.LARARLOSEN != ''
        run: python3 sjoskolan/verktyg/larare/week44_acceptance.py --before
      - name: Rebuild and verify protected teacher notes
        if: env.LARARLOSEN != ''
        run: python3 sjoskolan/verktyg/larare/week44_acceptance.py
      - name: Publish only encrypted teacher presentations
        if: env.LARARLOSEN != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sjoskolan/larare/filer/v44_*_larare.pptx.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reconciled Week 44 encrypted teacher notes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
