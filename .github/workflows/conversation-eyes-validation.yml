name: Validate conversation-eye correction

on:
  push:
    branches: [chatgpt/conversation-eyes-validation-20261024]

permissions:
  contents: write

concurrency:
  group: conversation-eyes-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - name: Install locked dependencies
        working-directory: johansson-town
        run: npm ci --no-audit --no-fund
      - name: Reproduce regression on unchanged source
        working-directory: johansson-town
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/conversation-eyes"
          set +e
          node --test --test-name-pattern='greeting nod' tests/conversation-eyes.test.mjs > "$RUNNER_TEMP/conversation-eyes/before.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/conversation-eyes/before.txt"
          test "$result" -ne 0
          grep -q 'GREETING_EYES_REGRESSION' "$RUNNER_TEMP/conversation-eyes/before.txt"
      - name: Apply the one-line fix and register its regression suite
        working-directory: johansson-town
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='src/avatars/actors.js',source=readFileSync(file,'utf8');
          assert.equal(source.split("Nod:'content'").length,2,'Exactly one existing nod mapping');
          writeFileSync(file,source.replace("Nod:'content'","Nod:'smile'"));
          const guard='tests/ci-guard.txt',list=readFileSync(guard,'utf8');
          assert.ok(!list.includes('conversation-eyes.test.mjs'));
          writeFileSync(guard,list.trimEnd()+'\nconversation-eyes.test.mjs\n');
          JS
      - name: Real avatar and controller regression tests
        working-directory: johansson-town
        run: node --test tests/conversation-eyes.test.mjs | tee "$RUNNER_TEMP/conversation-eyes/after.txt"
      - name: Rebuild published runtime once, retaining predecessor chunks
        working-directory: johansson-town
        run: npm run build:runtime | tee "$RUNNER_TEMP/conversation-eyes/build.txt"
      - name: Verify runtime packaging
        working-directory: johansson-town
        run: node --test tests/runtime-package.test.mjs | tee "$RUNNER_TEMP/conversation-eyes/runtime-package.txt"
      - name: Full World guard
        working-directory: johansson-town
        run: node tools/ci-guard.mjs | tee "$RUNNER_TEMP/conversation-eyes/guard.txt"
      - name: Install software Chromium for actual-game smoke
        working-directory: johansson-town
        run: npx playwright install --with-deps chromium
      - name: Boot built game, enter play and render street and room
        working-directory: johansson-town
        timeout-minutes: 8
        run: |
          export TOWN_CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright";console.log(chromium.executablePath())')"
          node tools/cloud-boot-smoke.mjs "$RUNNER_TEMP/conversation-eyes/game" | tee "$RUNNER_TEMP/conversation-eyes/game.txt"
      - name: Record actual checks and prepare validated branch only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const output=process.env.RUNNER_TEMP+'/conversation-eyes/';
          const report=JSON.parse(readFileSync(output+'game/report.json','utf8'));
          assert.equal(report.errors.length,0);assert.equal(report.steps.length,6);
          const run=`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const path='johansson-town/briefs/HANDOFF-CONVERSATION-EYES-2026-10-24.md';
          const note=['# Johansson conversation eyes — 24 October 2026','',
          'Owner authorisation: "Push to main if it works."','',
          'Base: `aee7515f53817cb743c820607baf2e8c6d6a27ab`. Validation branch: `chatgpt/conversation-eyes-validation-20261024`.',
          'Status: validated candidate on this branch; this workflow does not update main. The supervising agent must inspect and promote the final tree.','',
          '## Change',
          'Only the player gesture mapping `Nod: content` becomes `Nod: smile` in `src/avatars/actors.js`. Conversation entry already uses Nod. Its former content expression deliberately draws closed eyes. The existing smile keeps the eyes open except for natural blinks. No face artwork, gesture duration, speaking, sleeping, other expressions, recipes or saves changed.',
          'Added four regression tests using the real shared avatar geometry, player controller and animator; the Node DOM/canvas uses the existing repository fixture. Registered the suite in the full World guard. Rebuilt runtime/index/service-worker outputs once with the existing builder, retaining predecessor chunks.','',
          '## Checks actually completed',
          '- The new greeting test failed on the unchanged source with GREETING_EYES_REGRESSION before the fix.',
          '- Four actual-controller regression tests passed after the fix: greeting, repeated greeting/expiry, speech and natural blink recovery, and authored closed-eye gestures/sleep.',
          '- `npm run build:runtime` passed.',
          '- `node --test tests/runtime-package.test.mjs` passed.',
          '- `node tools/ci-guard.mjs` passed in full. See the linked run for counts and exact logs.',
          '- Built-game software Chromium smoke passed all six steps, including START/play, street rendering, Community Hall entry and room rendering, with zero page errors. Screenshots and report are attached to the run.',
          `- Evidence: [validation run](${run}), artifact conversation-eyes-validation.`,'',
          '## Limits and next action',
          'The full-game smoke covers startup and room entry, not a photographed dialogue interaction. The controller tests exercise the greeting directly. No physical iPhone/iPad, Steam Deck, hardware FPS or newly packaged Linux release is claimed.',
          'Remove the temporary branch-only validation workflow from the final delivery tree; inspect scope and current main before promoting. Do not overwrite concurrent main changes. Main promotion and Pages deployment must be verified separately.',''].join('\n');
          writeFileSync(path,note);
          const indexPath='HANDOVER.md',index=readFileSync(indexPath,'utf8');
          const marker='| Work area | Current handover |\n| --- | --- |';assert.ok(index.includes(marker));
          const row='| Conversation greeting eyes | [24 October correction and validation](johansson-town/briefs/HANDOFF-CONVERSATION-EYES-2026-10-24.md). One-line nod expression correction; actual controller tests, rebuilt runtime, complete guard and built-game smoke passed on the validation branch. Check the note and current main for promotion state. |';
          writeFileSync(indexPath,index.replace(marker,marker+'\n'+row));
          const allowed=p=>['HANDOVER.md','johansson-town/src/avatars/actors.js','johansson-town/tests/ci-guard.txt','johansson-town/index.html','johansson-town/creator/index.html','johansson-town/sw.js',path].includes(p)||p.startsWith('johansson-town/runtime/');
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.ok(changed.every(allowed),'Unexpected changed paths: '+changed.filter(p=>!allowed(p)).join(', '));
          JS
          git diff --check -- HANDOVER.md johansson-town/src johansson-town/tests johansson-town/briefs
          git add -- HANDOVER.md johansson-town/src/avatars/actors.js johansson-town/tests/ci-guard.txt johansson-town/runtime johansson-town/index.html johansson-town/creator/index.html johansson-town/sw.js johansson-town/briefs/HANDOFF-CONVERSATION-EYES-2026-10-24.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix Johansson greeting eyes with validated runtime and regression coverage'
          test "$GITHUB_REF_NAME" = 'chatgpt/conversation-eyes-validation-20261024'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git show --stat --oneline HEAD
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-eyes-validation
          path: ${{ runner.temp }}/conversation-eyes
          retention-days: 14
