name: Module 1 browser acceptance
on:
  push:
    paths: ['sjoskolan/vecka-37/revision/**', '.github/workflows/module-one-browser.yml']
  pull_request:
    paths: ['sjoskolan/vecka-37/revision/**', '.github/workflows/module-one-browser.yml']
permissions:
  contents: read
jobs:
  student-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Install pinned browser-test dependencies
        working-directory: sjoskolan/multimetersimulator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: node sjoskolan/multimetersimulator/node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: Model, student interaction and original preservation tests
        run: node --test sjoskolan/vecka-37/revision/*.test.mjs
      - name: Desktop, phone and tablet student journeys
        run: node sjoskolan/multimetersimulator/node_modules/@playwright/test/cli.js test -c sjoskolan/vecka-37/revision/student-browser.config.mjs --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-one-browser-evidence
          path: |
            sjoskolan/vecka-37/revision/browser-results/
            sjoskolan/vecka-37/revision/browser-report/
          retention-days: 14
