name: Studio body motion and terminal refit
on:
  push:
    branches: [codex/studio-motion-terminal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-motion-terminal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: johansson-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - run: npm ci
      - run: node --test tests/motion.test.mjs tests/port-hall-finish.test.mjs ../avatar-creator/tests/performance.test.mjs
      - run: npm run build:runtime
      - run: node --test tests/runtime-package.test.mjs
      - name: Save generated runtime patch
        run: |
          git add -f -A runtime
          git add index.html creator/index.html
          git diff --cached --binary > /tmp/studio-motion-runtime.patch
      - run: npx playwright install --with-deps chromium
      - name: Inspect Studio and terminal previews
        run: |
          python3 -m http.server 8765 --directory .. > /tmp/studio-motion-server.log 2>&1 &
          node ../avatar-creator/tests/motion-terminal.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-motion-terminal-review
          path: |
            johansson-town/docs/qa/motion-terminal/
            /tmp/studio-motion-runtime.patch
            /tmp/studio-motion-server.log
