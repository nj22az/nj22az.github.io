name: Multimeter browser acceptance

on:
  workflow_dispatch:
  push:
    paths: ['sjoskolan/multimetersimulator/**', 'sjoskolan/gemensamt/**', '.github/workflows/multimeter-browser.yml']
  pull_request:
    paths: ['sjoskolan/multimetersimulator/**', 'sjoskolan/gemensamt/**', '.github/workflows/multimeter-browser.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sjoskolan/multimetersimulator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The browsers are cached by Playwright version; the system libraries are installed every time (apt), with
      # its own time limit so a stuck mirror fails fast instead of eating the job.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('sjoskolan/multimetersimulator/package-lock.json') }}
      - run: npx playwright install chromium webkit
      - run: npx playwright install-deps chromium webkit
        timeout-minutes: 12
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multimeter-browser-results
          path: |
            sjoskolan/multimetersimulator/test-results/
            sjoskolan/multimetersimulator/playwright-report/
          retention-days: 14
