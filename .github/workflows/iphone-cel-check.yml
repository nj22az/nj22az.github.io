name: Verify iPhone cel rendering
on:
  push:
    branches: [codex/iphone-cartoon-cel]
    paths:
      - johansson-town/src/render/cel.js
      - johansson-town/src/render/single-pass-colour.js
      - johansson-town/tests/cel-look.test.mjs
      - .github/workflows/iphone-cel-check.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - run: npm ci
        working-directory: johansson-town
      - run: node --test tests/cel-look.test.mjs tests/single-pass-colour.test.mjs tests/startup-recovery.test.mjs tests/render-stability.test.mjs
        working-directory: johansson-town
      - run: npm run build:runtime
        working-directory: johansson-town
      - run: node --test tests/runtime-package.test.mjs
        working-directory: johansson-town
      - name: Commit verified runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add johansson-town/runtime johansson-town/index.html johansson-town/creator/index.html johansson-town/sw.js
          git diff --cached --quiet || git commit -m "Build verified iPhone cartoon runtime"
          git push origin HEAD:codex/iphone-cartoon-cel
