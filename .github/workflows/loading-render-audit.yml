name: Loading and render audit
on:
  push:
    branches: [codex/loading-render-audit]
    paths:
      - '.github/workflows/loading-render-audit.yml'
      - 'johansson-town/src/**'
      - 'johansson-town/loading-progress.js'
      - 'johansson-town/tools/loading-audit-smoke.mjs'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: johansson-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - run: npm ci
      - run: node --test tests/loading-progress.test.mjs tests/startup-recovery.test.mjs tests/body-collision.test.mjs tests/graphics-lifecycle.test.mjs tests/title-preview-save.test.mjs tests/render-stability.test.mjs tests/cel-look.test.mjs
      - run: npm run build:runtime
      - run: node --test tests/runtime-package.test.mjs
      - run: npx playwright install --with-deps webkit
      - run: |
          python3 tools/serve-audit.py --port 8765 > /tmp/loading-audit-server.log 2>&1 &
          node tools/loading-audit-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-render-audit
          path: johansson-town/docs/qa/loading-render-audit
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime index.html creator/index.html sw.js docs/qa/loading-render-audit
          git diff --cached --quiet || git commit -m 'Record measured loading and WebKit rendering verification'
          git push origin HEAD:codex/loading-render-audit
