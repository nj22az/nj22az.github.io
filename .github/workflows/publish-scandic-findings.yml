name: Publish reviewed Swedish Scandic parking findings
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-scandic-findings.yml]
permissions:
  contents: read
concurrency:
  group: hotel-findings-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Inspect official property location data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import re
          folder=Path('_hotel-publication-qa');folder.mkdir(exist_ok=True)
          for slug in ['scandic-skelleftea','scandic-vaxjo']:
              url='https://www.scandichotels.com/en/hotels/'+slug
              try:
                  with urlopen(url, timeout=15) as response: text=response.read(8000000).decode('utf-8')
                  (folder/(slug+'-property.html')).write_text(text,encoding='utf-8')
                  print(slug,'official page bytes',len(text))
                  for match in list(re.finditer(r'latitude|longitude|coordinates|hotelLocation|\\"lat\\"|\\"lng\\"',text,re.I))[:8]:
                      print(text[max(0,match.start()-120):match.end()+240])
              except Exception as exc: print(slug,'location evidence unavailable:',type(exc).__name__)
          for asset in ['leaflet.js','leaflet.css']:
              try:
                  with urlopen('https://unpkg.com/leaflet@1.9.4/dist/'+asset, timeout=15) as response:
                      (folder/asset).write_bytes(response.read(1000000))
              except Exception as exc: print('QA map dependency unavailable:',type(exc).__name__)
          PY
      - name: Verify recorded data and public page
        run: |
          python3 tools/build-hotels.test.py
          python3 tools/build-hotels.py --check
          node --check blog/hotels/hotels.js
          node --check blog/hotels/hotels-map.js
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from urllib.request import urlopen
          results=[]
          for path in ['blog/hotels/index.html','blog/hotels/hotels.json','blog/hotels/hotel-reviews.csv']:
              expected=Path(path).read_bytes()
              try:
                  with urlopen('https://nj22az.github.io/'+path,timeout=15) as response:
                      body=response.read();status=response.status
                  result={'path':path,'status':status,'matchesRepository':body==expected,'sha256':hashlib.sha256(body).hexdigest()}
              except Exception as exc:result={'path':path,'error':type(exc).__name__}
              results.append(result)
          Path('_hotel-publication-qa/public-check.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Preserve publication review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-scandic-publication
          path: |
            blog/hotels/
            css/
            styles.css
            config.js
            shared.js
            theme-bootstrap.js
            tools/build-hotels.py
            tools/build-hotels.test.py
            tools/apply-scandic-findings.py
            HANDOVER.md
            _hotel-publication-qa/
          retention-days: 7
