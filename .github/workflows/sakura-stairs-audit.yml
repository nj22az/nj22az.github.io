name: Sakura stairs and night lighting
on:
  push:
    branches: [codex/sakura-internal-stairs]
    paths: ['.github/workflows/sakura-stairs-audit.yml', 'johansson-town/src/**', 'johansson-town/tools/sakura-stairs-smoke.mjs']
permissions:
  contents: write
concurrency:
  group: sakura-stairs-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: johansson-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - run: npm ci
      - run: node --test --test-force-exit tests/sakura-stairs.test.mjs tests/sakura-budget.test.mjs tests/sakura-light-transitions.test.mjs tests/sakura-rack-paths.test.mjs tests/shop-cycle.test.mjs tests/shop-street-view.test.mjs tests/indoor-camera.test.mjs tests/sakura-detail.test.mjs tests/sakura-evening-guests.test.mjs tests/housing-consolidation.test.mjs
      - run: npm run build:runtime
      - run: node --test tests/runtime-package.test.mjs
      - run: npx playwright install --with-deps webkit
      - run: |
          python3 tools/serve-audit.py --port 8765 > /tmp/sakura-audit-server.log 2>&1 &
          node tools/sakura-stairs-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sakura-stairs-audit
          path: johansson-town/docs/qa/sakura-internal-stairs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime index.html creator/index.html sw.js docs/qa/sakura-internal-stairs
          git diff --cached --quiet || git commit -m 'Record Sakura stair traversal and day/night render evidence'
          git push origin HEAD:codex/sakura-internal-stairs
