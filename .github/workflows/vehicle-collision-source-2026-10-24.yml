name: Vehicle collision publication sign-off
on:
  push:
    branches: [development]
    paths: ['.github/workflows/vehicle-collision-source-2026-10-24.yml']
permissions:
  contents: write
jobs:
  sign-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: review
      - uses: actions/checkout@v4
        with:
          path: transport
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve the tested implementation and make the player visible in evidence
        working-directory: review
        run: |
          test "$(git rev-parse HEAD)" = e12ab3b4042a14e74bad463f6fca4b0c25007425
          mkdir -p ../evidence
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('johansson-town/tools/vehicle-collision-smoke.mjs');s=p.read_text()
          old=" await page.keyboard.press('v');"
          new=" if(!await page.evaluate(()=>window.__JOHANSSON_AUDIT__.mouse.thirdPerson))await page.keyboard.press('v');\n assert.equal(await page.evaluate(()=>window.__JOHANSSON_AUDIT__.mouse.thirdPerson),true);check('third-person view enabled for collision photographs');"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          PY
      - name: Install locked test dependencies
        working-directory: review/johansson-town
        run: |
          npm ci --no-audit --no-fund
          if command -v google-chrome >/dev/null; then echo "TOWN_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Rerun actual compiled-game acceptance and photograph the separated characters
        working-directory: review/johansson-town
        run: |
          node --test tests/runtime-package.test.mjs 2>&1 | tee ../../evidence/runtime-package.txt
          node tools/vehicle-collision-smoke.mjs ../../evidence/game 2>&1 | tee ../../evidence/game.txt
      - name: Verify published runtime bytes and record sign-off
        working-directory: review
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import pathlib,json,os,shutil,urllib.request,time,hashlib
          root=pathlib.Path('.');out=pathlib.Path('../evidence');impl='e12ab3b4042a14e74bad463f6fca4b0c25007425'
          manifest=json.loads(pathlib.Path('johansson-town/runtime/.vite/manifest.json').read_text())
          paths=['johansson-town/index.html','johansson-town/runtime/source.json','johansson-town/sw.js','johansson-town/runtime/.vite/manifest.json']
          paths+=sorted({'johansson-town/runtime/'+v['file'] for v in manifest.values() if v.get('file','').startswith(('boot-','game-','scene-world-'))})
          results=[]
          for path in paths:
              expected=(root/path).read_bytes();error=None
              for attempt in range(12):
                  try:
                      req=urllib.request.Request('https://nj22az.github.io/'+path+'?vehicle-fix='+impl,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as response:actual=response.read()
                      if actual==expected:break
                      error='Published bytes do not yet match the tested revision'
                  except Exception as exc:error=str(exc)
                  time.sleep(5)
              else:raise RuntimeError(path+': '+str(error))
              results.append({'path':path,'matches':True,'sha256':hashlib.sha256(expected).hexdigest(),'bytes':len(expected)})
          publication={'implementationCommit':impl,'verifiedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'files':results,'passed':True,'validationRun':40098829273,'signoffRun':os.environ['RUN_ID']}
          (out/'publication.json').write_text(json.dumps(publication,indent=2)+'\n')
          report=json.loads((out/'game/report.json').read_text());assert report['passed']
          qa=pathlib.Path('johansson-town/docs/qa/vehicle-collision-2026-10-24')
          for p in (out/'game').iterdir():shutil.copyfile(p,qa/p.name)
          for filename in ['publication.json','runtime-package.txt']:shutil.copyfile(out/filename,qa/filename)
          note=pathlib.Path('johansson-town/briefs/HANDOFF-VEHICLE-COLLISION-2026-10-24.md');s=note.read_text();s=s.split('## Publication state')[0]
          s+='## Publication state — published and verified\nImplementation `'+impl+'` was fast-forwarded to main after reviewing the compiled-game evidence. The complete World guard passed **409/409 checks across 77 files**; the focused suite plus runtime packaging passed **28/28**. All nine new regression checks failed against the original source before the repair. The compiled-game acceptance passes all four walking approaches, a moving vehicle, driver prompt exclusion and safe recovery from an existing overlap; no page errors. Third-person desktop and phone-width photographs were recaptured without changing any production source or runtime file.\n\n[Publication evidence](../docs/qa/vehicle-collision-2026-10-24/publication.json) verifies the public HTML, service worker, manifest, source fingerprint and changed compiled entry/chunks byte-for-byte against the tested implementation. [Game report](../docs/qa/vehicle-collision-2026-10-24/report.json). Original build/guard workflow: 40098829273. Publication verification workflow: '+os.environ['RUN_ID']+'.\n\n## Limits and next action\nNo physical iPhone/Safari or packaged Linux test was performed. Existing web tabs must reload; saves are preserved. The shared source is repaired, but no new Linux installer was released. The temporary development transport/workflow files are removed after successful sign-off; the prototype branch is not merged. No implementation work remains for this defect.\n';note.write_text(s)
          index=pathlib.Path('HANDOVER.md');lines=index.read_text().splitlines();matches=0
          for i,line in enumerate(lines):
              if line.startswith('| World: moving car collisions |'):
                  lines[i]='| World: moving car collisions | [24 October vehicle-collision repair](johansson-town/briefs/HANDOFF-VEHICLE-COLLISION-2026-10-24.md). **Published to main as `e12ab3b`; live bytes verified.** 409/409 World guard, 28/28 focused/runtime checks, actual four-sided walking and overlap recovery pass. Moving/held/reversing/ferry car boundaries remain solid; seated drivers cannot be approached for conversations. Desktop and phone-width evidence included; no new Linux installer. |';matches+=1
          assert matches==1;index.write_text('\n'.join(lines)+'\n')
          PY
          git diff --check
          git add HANDOVER.md johansson-town/briefs/HANDOFF-VEHICLE-COLLISION-2026-10-24.md johansson-town/docs/qa/vehicle-collision-2026-10-24 johansson-town/tools/vehicle-collision-smoke.mjs
          git config user.name 'Nils Johansson'
          git config user.email '154246134+nj22az@users.noreply.github.com'
          git commit -m 'Sign off live car collision repair with third-person acceptance evidence'
          git rev-parse HEAD | tee ../evidence/signoff-sha.txt
          git push origin HEAD:refs/tags/review/vehicle-collision-signoff-${RUN_ID}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-collision-publication
          path: evidence
          retention-days: 3
      - name: Remove temporary validation files without touching development prototypes
        working-directory: transport
        run: |
          git fetch origin development
          git checkout -B development origin/development
          git rm .github/workflows/vehicle-collision-source-2026-10-24.yml .github/vehicle-collision-2026-10-24.patch.gz.b64
          git config user.name 'Nils Johansson'
          git config user.email '154246134+nj22az@users.noreply.github.com'
          git commit -m 'Remove completed vehicle-collision validation transport; preserve prototypes'
          git push origin HEAD:refs/heads/development
