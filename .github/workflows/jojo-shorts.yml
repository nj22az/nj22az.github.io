name: JoJo Engineering shorts

on:
  push:
    paths: ['jojo-engineering/**', '.github/workflows/jojo-shorts.yml']
  pull_request:
    paths: ['jojo-engineering/**', '.github/workflows/jojo-shorts.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Reading speed, length, hooks and metadata
        run: node jojo-engineering/shorts/check.mjs
