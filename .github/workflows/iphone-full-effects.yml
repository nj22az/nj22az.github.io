name: Verify bounded full cartoon rendering
on:
  push:
    branches: [codex/iphone-full-effects]
    paths:
      - johansson-town/src/**
      - johansson-town/tests/**
      - johansson-town/tools/iphone-render-smoke.mjs
      - .github/workflows/iphone-full-effects.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - run: npm ci
        working-directory: johansson-town
      - run: node --test tests/cel-look.test.mjs tests/render-stability.test.mjs tests/startup-recovery.test.mjs tests/single-pass-colour.test.mjs tests/graphics-lifecycle.test.mjs tests/ink-recovery.test.mjs tests/launch-report.test.mjs
        working-directory: johansson-town
      - run: npm run build:runtime
        working-directory: johansson-town
      - run: node --test tests/runtime-package.test.mjs
        working-directory: johansson-town
      - run: npx playwright install --with-deps chromium webkit
        working-directory: johansson-town
      - name: Fetch previous renderer for GPU comparison
        run: git fetch --depth=1 origin a42fad65dc19c577f7f9b5707be152618aa92180
      - name: Check compiled town and shader parity
        working-directory: johansson-town
        run: |
          python3 tools/serve-audit.py --port 8765 > /tmp/town-http.log 2>&1 &
          node tools/iphone-render-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-full-effects-evidence
          path: johansson-town/docs/qa/iphone-full-effects
      - name: Commit verified runtime and browser evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add johansson-town/runtime johansson-town/index.html johansson-town/creator/index.html johansson-town/sw.js johansson-town/docs/qa/iphone-full-effects
          git diff --cached --quiet || git commit -m "Build full cartoon runtime and record GPU browser checks"
          git push origin HEAD:codex/iphone-full-effects
