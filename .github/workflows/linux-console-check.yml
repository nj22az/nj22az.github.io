name: Linux console acceptance
on:
  pull_request:
    branches: [main, codex/johansson-world-steam-deck]
    paths: ['steam-deck/**', 'johansson-town/**', '.github/workflows/linux-console-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-console-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    # Full software-rendered console coverage includes 26 residents, a reload,
    # a separate web boot and native saves after the four-size/controller checks.
    # The steps before the full acceptance take about ten minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build and acceptance tools
        run: |
          npm install --prefix .world-build --ignore-scripts --no-audit --no-fund vite@7.3.6 spectorjs@0.9.33
          ln -s ../.world-build/node_modules johansson-town/node_modules
          npm ci --prefix steam-deck --no-audit --no-fund
          node steam-deck/node_modules/electron/install.js
          steam-deck/node_modules/.bin/playwright install --with-deps chromium
      - name: Controller, gameplay, save and update regression tests
        run: |
          npm test --prefix steam-deck
          node --test johansson-town/tests/controller-game.test.mjs johansson-town/tests/harbour-festival.test.mjs johansson-town/tests/detail-stream.test.mjs johansson-town/tests/context-actions.test.mjs johansson-town/tests/soundscape.test.mjs johansson-town/tests/thuan-studio-design.test.mjs johansson-town/tests/housing-consolidation.test.mjs johansson-town/tests/sakura-stairs.test.mjs johansson-town/tests/shop-street-view.test.mjs johansson-town/tests/graphics-lifecycle.test.mjs
      - name: Build offline Linux candidate
        run: |
          node johansson-town/scripts/build-runtime.mjs
          npm run package --prefix steam-deck
      - name: Packaged facial visibility across all Looks
        env:
          FACE_BROWSER_TEST: '1'
          FACE_GAME_ROOT: steam-deck/dist/johansson-world/resources/app/site/johansson-town
          FACE_OUTPUT_DIRECTORY: steam-deck/dist/face-visibility
        run: |
          steam-deck/node_modules/.bin/playwright install --with-deps chromium
          node --test johansson-town/tests/face-lighting.browser.mjs
      - name: Controller recovery acceptance
        run: node steam-deck/tools/control-repair-smoke.cjs
      - name: Verify native application and disk saves
        env:
          WORLD_SCREENSHOT: steam-deck/dist/linux-world.png
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1
          timeout 300 xvfb-run -a steam-deck/dist/johansson-world/JohanssonWorld --no-sandbox --windowed --smoke --use-angle=swiftshader --enable-unsafe-swiftshader --disable-dev-shm-usage
      - name: Verify packaged site without network access
        run: node steam-deck/tools/offline-browser-smoke.cjs
      - name: Full world controller, layout, resident and save acceptance
        # The web-only recovery runs after the Linux acceptance in this step; 20 minutes cut it off (#388).
        run: timeout 30m npm run test:console --prefix steam-deck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-console-candidate
          path: |
            steam-deck/dist/johansson-world-linux-x64.tar.gz
            steam-deck/dist/SHA256SUMS
            steam-deck/dist/latest-linux.json
            steam-deck/dist/bundle-manifest.json
            steam-deck/dist/face-visibility/
            steam-deck/dist/console-qa/
            steam-deck/dist/control-repair/
            steam-deck/dist/linux-world*.png
          if-no-files-found: warn
