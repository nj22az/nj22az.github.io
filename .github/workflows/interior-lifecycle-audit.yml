name: Interior rendering and resident continuity
on:
  push:
    branches: [codex/interior-lifecycle-audit]
permissions:
  contents: write
concurrency:
  group: interior-lifecycle-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: johansson-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: johansson-town/package-lock.json
      - run: npm ci
      - run: node --test --test-force-exit tests/interior-lifecycle.test.mjs tests/resident-journeys.test.mjs tests/shop-street-view.test.mjs tests/stand-in.test.mjs tests/sakura-light-transitions.test.mjs tests/sakura-stairs.test.mjs tests/shop-cycle.test.mjs tests/home-interiors.test.mjs tests/canonical-overnight.test.mjs tests/continuous-life.test.mjs tests/izakaya-hours.test.mjs tests/living-town.test.mjs tests/fujita-day.test.mjs
      - run: npm run build:runtime
      - run: node --test tests/runtime-package.test.mjs
      - run: npx playwright install --with-deps webkit
      - run: |
          python3 tools/serve-audit.py --port 8765 > /tmp/interior-audit-server.log 2>&1 &
          timeout 360s node tools/interior-lifecycle-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-lifecycle-audit
          path: johansson-town/docs/qa/interior-lifecycle
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime index.html creator/index.html sw.js docs/qa/interior-lifecycle
          git diff --cached --quiet || git commit -m 'Build and verify interior lifecycle in mobile WebKit'
          git push origin HEAD:codex/interior-lifecycle-audit
