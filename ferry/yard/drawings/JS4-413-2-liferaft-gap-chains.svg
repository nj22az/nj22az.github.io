<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1200" width="1640" height="1200" font-family="Verdana, Geneva, sans-serif"><rect width="1640" height="1200" fill="#fbfaf5"/><text x="64.0" y="46.0" font-size="28" fill="#22303a" text-anchor="start" font-weight="bold">CHISUM</text><text x="202.0" y="46.0" font-size="15" fill="#22303a" text-anchor="start" font-weight="bold">Liferafts: the chains across their gaps in the rail · JS4-413 · sheet 2 · revision 0 · 13 November 2026</text><text x="64.0" y="66.0" font-size="11" fill="#8b959b" text-anchor="start" font-weight="normal">Boat deck, three rafts each side. Drawn before it is built. The rafts, their cradles and the rail are as built (blender/fittings_liferaft.py, steel.py); the chains are new.</text><text x="64.0" y="108.0" font-size="12" fill="#22303a" text-anchor="start" font-weight="bold">ACROSS THE DECK&#x27;S EDGE AT A RAFT</text><text x="64.0" y="124.0" font-size="11" fill="#8b959b" text-anchor="start" font-weight="normal">Looking forward on the port side: her side and the sea are to the right. Heights over the deck.</text><rect x="110.0" y="150.0" width="585.0" height="525.0" fill="#f1f4f6" stroke="#8b959b" stroke-width="1" rx="0"/><rect x="110.0" y="675.0" width="405.0" height="14.0" fill="#5c7f6b" stroke="#5c7f6b" stroke-width="1" rx="0"/><line x1="515.0" y1="675.0" x2="515.0" y2="725.0" stroke="#22303a" stroke-width="2"/><text x="523.0" y="705.0" font-size="10" fill="#8b959b" text-anchor="start" font-weight="normal">her side</text><rect x="463.4" y="415.3" width="13.2" height="259.7" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><rect x="452.0" y="672.0" width="36.0" height="3.0" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><rect x="253.4" y="370.7" width="13.2" height="304.3" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><rect x="242.0" y="672.0" width="36.0" height="3.0" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><line x1="239.0" y1="366.2" x2="491.0" y2="419.8" stroke="#5d6a72" stroke-width="3"/><text x="185.0" y="567.0" font-size="10" fill="#5d6a72" text-anchor="middle" font-weight="normal">the cradle:</text><text x="185.0" y="580.0" font-size="10" fill="#5d6a72" text-anchor="middle" font-weight="normal">a slope of 12°</text><circle cx="365.0" cy="342.0" r="105.0" fill="#ffffff" stroke="#22303a" stroke-width="1.6"/><text x="365.0" y="346.0" font-size="11" fill="#22303a" text-anchor="middle" font-weight="normal">the canister</text><circle cx="440.0" cy="357.9" r="113.4" fill="none" stroke="#c2412f" stroke-width="0.9"/><circle cx="511.7" cy="373.2" r="113.4" fill="none" stroke="#c2412f" stroke-width="0.9"/><path d="M365.0 342.0 L511.7 373.2" stroke="#c2412f" stroke-width="1" stroke-dasharray="5 3" fill="none"/><circle cx="488.0" cy="484.2" r="4.0" fill="#c2412f" stroke="#c2412f" stroke-width="1"/><line x1="493.0" y1="484.2" x2="575.0" y2="534.0" stroke="#c2412f" stroke-width="0.8"/><text x="581.0" y="537.0" font-size="10" fill="#c2412f" text-anchor="start" font-weight="normal">let go, it rolls over</text><text x="581.0" y="550.0" font-size="10" fill="#c2412f" text-anchor="start" font-weight="normal">the side: it crosses the</text><text x="581.0" y="563.0" font-size="10" fill="#c2412f" text-anchor="start" font-weight="normal">rail&#x27;s line 0.64 m over</text><text x="581.0" y="576.0" font-size="10" fill="#c2412f" text-anchor="start" font-weight="normal">the deck and falls</text><text x="581.0" y="589.0" font-size="10" fill="#c2412f" text-anchor="start" font-weight="normal">from there</text><line x1="488.0" y1="675.0" x2="488.0" y2="363.0" stroke="#8b959b" stroke-width="0.8" stroke-dasharray="2 4"/><circle cx="488.0" cy="375.0" r="5.0" fill="none" stroke="#8b959b" stroke-width="1.2"/><line x1="494.0" y1="373.0" x2="575.0" y2="195.0" stroke="#5d6a72" stroke-width="0.8"/><text x="581.0" y="177.0" font-size="10" fill="#5d6a72" text-anchor="start" font-weight="normal">the rail&#x27;s top course:</text><text x="581.0" y="190.0" font-size="10" fill="#5d6a72" text-anchor="start" font-weight="normal">no chain. The canister</text><text x="581.0" y="203.0" font-size="10" fill="#5d6a72" text-anchor="start" font-weight="normal">is the guard here</text><circle cx="488.0" cy="490.5" r="5.0" fill="#6f7a80" stroke="#22303a" stroke-width="1"/><circle cx="488.0" cy="606.0" r="5.0" fill="#6f7a80" stroke="#22303a" stroke-width="1"/><line x1="522.0" y1="492.5" x2="494.0" y2="490.5" stroke="#5d6a72" stroke-width="0.8"/><circle cx="522.0" cy="492.5" r="10.0" fill="#fbfaf5" stroke="#22303a" stroke-width="1.2"/><text x="522.0" y="496.5" font-size="11" fill="#22303a" text-anchor="middle" font-weight="bold">1</text><line x1="522.0" y1="608.0" x2="494.0" y2="606.0" stroke="#5d6a72" stroke-width="0.8"/><circle cx="522.0" cy="608.0" r="10.0" fill="#fbfaf5" stroke="#22303a" stroke-width="1.2"/><text x="522.0" y="612.0" font-size="11" fill="#22303a" text-anchor="middle" font-weight="bold">1</text><line x1="94.0" y1="675.0" x2="94.0" y2="447.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="89.0" y1="675.0" x2="99.0" y2="675.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="89.0" y1="447.0" x2="99.0" y2="447.0" stroke="#5d6a72" stroke-width="0.8"/><text x="86.0" y="565.0" font-size="11" fill="#5d6a72" text-anchor="end" font-weight="normal">0.76</text><text x="118.0" y="462.0" font-size="10" fill="#5d6a72" text-anchor="start" font-weight="normal">the canister&#x27;s underside:</text><text x="118.0" y="475.0" font-size="10" fill="#5d6a72" text-anchor="start" font-weight="normal">under it the edge was open</text><line x1="110.0" y1="447.0" x2="365.0" y2="447.0" stroke="#5d6a72" stroke-width="0.6" stroke-dasharray="2 3"/><line x1="365.0" y1="709.0" x2="515.0" y2="709.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="365.0" y1="704.0" x2="365.0" y2="714.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="515.0" y1="704.0" x2="515.0" y2="714.0" stroke="#5d6a72" stroke-width="0.8"/><text x="440.0" y="725.0" font-size="11" fill="#5d6a72" text-anchor="middle" font-weight="normal">0.50</text><text x="790.0" y="108.0" font-size="12" fill="#22303a" text-anchor="start" font-weight="bold">ALONG THE GAP</text><text x="790.0" y="124.0" font-size="11" fill="#8b959b" text-anchor="start" font-weight="normal">Seen from inboard, the sea behind the sheet: forward is to the right (port side). The rail&#x27;s gap is 1.7 m; the canister is 1.45 m long.</text><rect x="830.0" y="150.0" width="690.0" height="525.0" fill="#f1f4f6" stroke="#8b959b" stroke-width="1" rx="0"/><rect x="830.0" y="675.0" width="690.0" height="14.0" fill="#5c7f6b" stroke="#5c7f6b" stroke-width="1" rx="0"/><rect x="957.5" y="237.0" width="435.0" height="210.0" fill="#ffffff" stroke="#22303a" stroke-width="1.4" rx="70"/><text x="1175.0" y="346.0" font-size="11" fill="#22303a" text-anchor="middle" font-weight="normal">the canister on its cradle</text><rect x="1027.4" y="447.0" width="13.2" height="228.0" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><rect x="1011.5" y="672.0" width="45.0" height="3.0" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><rect x="1309.4" y="447.0" width="13.2" height="228.0" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><rect x="1293.5" y="672.0" width="45.0" height="3.0" fill="#d8dcdd" stroke="#5d6a72" stroke-width="0.8" rx="0"/><line x1="1430.0" y1="375.0" x2="1520.0" y2="375.0" stroke="#22303a" stroke-width="4"/><line x1="1430.0" y1="490.5" x2="1520.0" y2="490.5" stroke="#22303a" stroke-width="2.6"/><line x1="1430.0" y1="606.0" x2="1520.0" y2="606.0" stroke="#22303a" stroke-width="2.6"/><line x1="1430.0" y1="675.0" x2="1430.0" y2="375.0" stroke="#22303a" stroke-width="3"/><line x1="920.0" y1="375.0" x2="830.0" y2="375.0" stroke="#22303a" stroke-width="4"/><line x1="920.0" y1="490.5" x2="830.0" y2="490.5" stroke="#22303a" stroke-width="2.6"/><line x1="920.0" y1="606.0" x2="830.0" y2="606.0" stroke="#22303a" stroke-width="2.6"/><line x1="920.0" y1="675.0" x2="920.0" y2="375.0" stroke="#22303a" stroke-width="3"/><text x="875.0" y="345.0" font-size="9" fill="#5d6a72" text-anchor="middle" font-weight="normal">rail</text><text x="1475.0" y="345.0" font-size="9" fill="#5d6a72" text-anchor="middle" font-weight="normal">rail</text><path d="M932.0 490.5 L961.4 492.3 L990.9 493.8 L1020.3 495.1 L1049.8 496.1 L1079.2 496.9 L1108.6 497.5 L1138.1 497.9 L1167.5 498.0 L1196.9 497.9 L1226.4 497.5 L1255.8 496.9 L1285.2 496.1 L1314.7 495.1 L1344.1 493.8 L1373.6 492.3 L1403.0 490.5" fill="none" stroke="#6f7a80" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="5 2"/><circle cx="927.8" cy="490.5" r="3.4" fill="none" stroke="#22303a" stroke-width="1.2"/><circle cx="1422.2" cy="490.5" r="3.4" fill="none" stroke="#22303a" stroke-width="1.2"/><path d="M1403.0 490.5 L1415.0 489.3 L1422.2 486.9 L1425.2 490.5 L1422.2 494.1 L1415.0 493.5" fill="none" stroke="#c2412f" stroke-width="1.6" stroke-linejoin="round"/><path d="M932.0 490.5 L942.5 592.0 L959.0 667.2 L1227.5 667.2" fill="none" stroke="#5d6a72" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M932.0 606.0 L961.4 607.8 L990.9 609.3 L1020.3 610.6 L1049.8 611.6 L1079.2 612.4 L1108.6 613.0 L1138.1 613.4 L1167.5 613.5 L1196.9 613.4 L1226.4 613.0 L1255.8 612.4 L1285.2 611.6 L1314.7 610.6 L1344.1 609.3 L1373.6 607.8 L1403.0 606.0" fill="none" stroke="#6f7a80" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="5 2"/><circle cx="927.8" cy="606.0" r="3.4" fill="none" stroke="#22303a" stroke-width="1.2"/><circle cx="1422.2" cy="606.0" r="3.4" fill="none" stroke="#22303a" stroke-width="1.2"/><path d="M1403.0 606.0 L1415.0 604.8 L1422.2 602.4 L1425.2 606.0 L1422.2 609.6 L1415.0 609.0" fill="none" stroke="#c2412f" stroke-width="1.6" stroke-linejoin="round"/><path d="M932.0 606.0 L942.5 644.0 L959.0 663.6 L1343.0 663.6" fill="none" stroke="#5d6a72" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 3"/><line x1="1250.0" y1="470.5" x2="1250.0" y2="496.0" stroke="#5d6a72" stroke-width="0.8"/><circle cx="1250.0" cy="470.5" r="10.0" fill="#fbfaf5" stroke="#22303a" stroke-width="1.2"/><text x="1250.0" y="474.5" font-size="11" fill="#22303a" text-anchor="middle" font-weight="bold">1</text><line x1="1460.0" y1="514.5" x2="1421.0" y2="493.5" stroke="#5d6a72" stroke-width="0.8"/><circle cx="1460.0" cy="514.5" r="10.0" fill="#fbfaf5" stroke="#22303a" stroke-width="1.2"/><text x="1460.0" y="518.5" font-size="11" fill="#22303a" text-anchor="middle" font-weight="bold">2</text><line x1="890.0" y1="582.0" x2="927.8" y2="603.0" stroke="#5d6a72" stroke-width="0.8"/><circle cx="890.0" cy="582.0" r="10.0" fill="#fbfaf5" stroke="#22303a" stroke-width="1.2"/><text x="890.0" y="586.0" font-size="11" fill="#22303a" text-anchor="middle" font-weight="bold">3</text><text x="1265.0" y="642.0" font-size="10" fill="#5d6a72" text-anchor="middle" font-weight="normal">let go (dashed): they hang from the after</text><text x="1265.0" y="655.0" font-size="10" fill="#5d6a72" text-anchor="middle" font-weight="normal">post and lie on the deck</text><line x1="920.0" y1="709.0" x2="1430.0" y2="709.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="920.0" y1="704.0" x2="920.0" y2="714.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="1430.0" y1="704.0" x2="1430.0" y2="714.0" stroke="#5d6a72" stroke-width="0.8"/><text x="1175.0" y="725.0" font-size="11" fill="#5d6a72" text-anchor="middle" font-weight="normal">1.7 m</text><line x1="1536.0" y1="675.0" x2="1536.0" y2="490.5" stroke="#5d6a72" stroke-width="0.8"/><line x1="1531.0" y1="675.0" x2="1541.0" y2="675.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="1531.0" y1="490.5" x2="1541.0" y2="490.5" stroke="#5d6a72" stroke-width="0.8"/><text x="1544.0" y="586.8" font-size="11" fill="#5d6a72" text-anchor="start" font-weight="normal">0.615</text><line x1="1582.0" y1="675.0" x2="1582.0" y2="606.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="1577.0" y1="675.0" x2="1587.0" y2="675.0" stroke="#5d6a72" stroke-width="0.8"/><line x1="1577.0" y1="606.0" x2="1587.0" y2="606.0" stroke="#5d6a72" stroke-width="0.8"/><text x="1590.0" y="644.5" font-size="11" fill="#5d6a72" text-anchor="start" font-weight="normal">0.23</text><text x="838.0" y="166.0" font-size="10" fill="#8b959b" text-anchor="start" font-weight="normal">aft</text><text x="1512.0" y="166.0" font-size="10" fill="#8b959b" text-anchor="end" font-weight="normal">forward</text><text x="64.0" y="771.0" font-size="12" fill="#22303a" text-anchor="start" font-weight="bold">HOW IT IS WORKED, AND WHY IT IS SO</text><text x="64.0" y="791.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· The canister fills its gap from 0.76 m up and is itself the guard there. Under it the deck&#x27;s edge was open: 0.76 m high, 1.7 m long. The rail&#x27;s middle and bottom courses are carried across that opening</text><text x="64.0" y="807.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">  in chain.</text><text x="64.0" y="826.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· A CHAIN ACROSS THE GAP STANDS IN THE RAFT&#x27;S WAY when it is rolled over the side by hand: it crosses the rail&#x27;s line 0.64 m over the deck and falls from there. So each chain is held at its forward end by</text><text x="64.0" y="842.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">  a slip hook that lets go at a pull, and letting the chains go is a step of launching: the placard on each cradle has it as step 2.</text><text x="64.0" y="861.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· A raft set free by its hydrostatic release floats up, clear of the chains: they are beside it and lower. Nothing has to be let go for that.</text><text x="64.0" y="880.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· On the page: a tap on a gap&#x27;s chains lets both go; a tap rigs them again. Six gaps, each by itself.</text><text x="64.0" y="911.0" font-size="12" fill="#22303a" text-anchor="start" font-weight="bold">NOT BUILT, PLAINLY</text><text x="64.0" y="931.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· The rafts are not launched on the page, so nothing refuses a launch with the chains up. No scantling is calculated; chain, hooks and eyes are the yard&#x27;s choice.</text><text x="64.0" y="950.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· Beside each end of the canister 0.125 m of the gap is open above the chains, wider at the canister&#x27;s rounded ends: not closed.</text><text x="64.0" y="969.0" font-size="11" fill="#22303a" text-anchor="start" font-weight="normal">· Whether a guard may stand before a float-free liferaft at all is a question for class: the rule was not read. The yard&#x27;s own answer is the slip hooks and the placard.</text><text x="64.0" y="1006.0" font-size="12" fill="#22303a" text-anchor="start" font-weight="bold">ITS PARTS, AT EACH GAP</text><rect x="64.0" y="1016.0" width="1512.0" height="20.0" fill="#e9e6dc" stroke="#22303a" stroke-width="0.8" rx="0"/><text x="68.0" y="1030.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="bold">No.</text><text x="108.0" y="1030.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="bold">What</text><text x="334.0" y="1030.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="bold">How many</text><text x="524.0" y="1030.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="bold">Note</text><line x1="64.0" y1="1061.0" x2="1576.0" y2="1061.0" stroke="#ddd9cd" stroke-width="0.8"/><text x="68.0" y="1056.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">1</text><text x="108.0" y="1056.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">Chain</text><text x="334.0" y="1056.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">2, each 1.56 m</text><text x="524.0" y="1056.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">8 mm galvanised chain at 0.615 and 0.23 m: the rail&#x27;s middle and bottom courses. It runs 38 mm outboard of the cradle&#x27;s outboard legs</text><line x1="64.0" y1="1081.0" x2="1576.0" y2="1081.0" stroke="#ddd9cd" stroke-width="0.8"/><text x="68.0" y="1076.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">2</text><text x="108.0" y="1076.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">Slip hook</text><text x="334.0" y="1076.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">2</text><text x="524.0" y="1076.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">At each chain&#x27;s forward end, in an eye on the rail&#x27;s forward post: its jaw is held shut by a ring; the ring pulled back, it lets go under load</text><line x1="64.0" y1="1101.0" x2="1576.0" y2="1101.0" stroke="#ddd9cd" stroke-width="0.8"/><text x="68.0" y="1096.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">3</text><text x="108.0" y="1096.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">Eye</text><text x="334.0" y="1096.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">4</text><text x="524.0" y="1096.0" font-size="10" fill="#22303a" text-anchor="start" font-weight="normal">Welded to the two rail posts on the gap&#x27;s side, at each chain&#x27;s height. The chain is shackled to the after one</text><text x="64.0" y="1178.0" font-size="10" fill="#8b959b" text-anchor="start" font-weight="normal">Made by ferry/yard/drawings/guard_drawing.py from ferry/blender/guard_place.py: the numbers the chains are built from.</text><text x="1576.0" y="1178.0" font-size="10" fill="#8b959b" text-anchor="end" font-weight="normal">Not class-approved; not construction information.</text></svg>