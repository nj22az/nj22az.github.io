<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc"><title id="title">Gemensam matning kan påverka två funktioner</title><desc id="desc">Ett funktionsschema visar hur en gemensam matning förgrenas till arbetsbelysning och länspump. En frånkoppling före förgreningen påverkar båda. Detta är inte ett installationsschema.</desc><metadata>Symbols adapted from ma-laforge/ElectricalDiagrams, MIT licence. See /licenses/ElectricalDiagrams-MIT.txt.</metadata><defs><marker id="current-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007d35"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="410.0" y="37" font-family="DejaVu Sans,sans-serif" font-size="25" text-anchor="middle" fill="#111" font-weight="700">Gemensam matning kan påverka två funktioner</text><rect x="45" y="175" width="175" height="70" rx="4" fill="white" stroke="#111" stroke-width="3"/><text x="132.5" y="217.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#111">Matning</text><polyline points="220,210 370,210 370,125 500,125" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><polyline points="370,210 370,295 500,295" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="370" cy="210" r="4.5" fill="#111"/><rect x="500" y="90" width="260" height="70" rx="4" fill="white" stroke="#111" stroke-width="3"/><text x="630.0" y="132.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#111">Arbetsbelysning</text><rect x="500" y="260" width="260" height="70" rx="4" fill="white" stroke="#111" stroke-width="3"/><text x="630.0" y="302.0" font-family="DejaVu Sans,sans-serif" font-size="21" text-anchor="middle" fill="#111">Länspump</text><text x="410" y="385" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="middle" fill="#111">Funktionsschema · samordna elektriskt arbete och driftbehov</text></svg>