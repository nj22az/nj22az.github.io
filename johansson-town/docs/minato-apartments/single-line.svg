60" y2="540" /><line class="pw" x1="860" y1="540" x2="890" y2="540" /><text class="lab" x="894" y="544" >Lift JL-600 (VVVF, 7.5 kW) · 10 kVA</text><line class="pw" x1="860" y1="510" x2="860" y2="562" /><line class="pw" x1="860" y1="562" x2="890" y2="562" /><text class="lab" x="894" y="566" >Booster pump (one running, 1.5 kW) · 2 kVA</text><line class="pw" x1="860" y1="510" x2="860" y2="584" /><line class="pw" x1="860" y1="584" x2="890" y2="584" /><text class="lab" x="894" y="588" >Blue Coral: freezers and counter · 8 kVA</text><line class="pw" x1="860" y1="510" x2="860" y2="606" /><line class="pw" x1="860" y1="606" x2="890" y2="606" /><text class="lab" x="894" y="610" >Rainflower Florist: flower cooler, lights · 5 kVA</text><text class="lab" x="860" y="650" >Common lighting, alarm, intercom, tank blowers: 1φ circuits on the LV board</text><rect class="t" x="40" y="720" width="560" height="110" /><text class="ttl" x="46" y="734" font-size="9">EACH FLAT (in its shaft and genkan)</text><text class="lab" x="50" y="752" >meter (utility) → 30 A limiter (the utility’s) + 2P 30 A ELCB 30 mA</text><text class="lab" x="50" y="766" style="font-size:8px">1 Lighting · 2 Sockets · 3 Sockets · 4 IH hob, 2 rings · 5 Air conditioner · 6 Unit bath · 7 Washing machine socket</text><text class="lab" x="50" y="780" >night-rate meter + time switch → water heater 2 kW</text><text class="ttl" x="1000" y="182" font-size="10">MAXIMUM DEMAND</text><text class="lab" x="1000" y="200" >Flats</text><text class="lab" x="1370" y="200" text-anchor="end">36 × 6 kVA × 0.45</text><text class="lab" x="1000" y="214" >Day, single-phase</text><text class="lab" x="1370" y="214" text-anchor="end">101.5 kVA</text><text class="lab" x="1000" y="228" >Night (heaters + 30 % of day)</text><text class="lab" x="1370" y="228" text-anchor="end">105.46 kVA</text><text class="lab" x="1000" y="242" >T1 single-phase</text><text class="lab" x="1370" y="242" text-anchor="end">150 kVA ✓</text><text class="lab" x="1000" y="256" >Three-phase loads</text><text class="lab" x="1370" y="256" text-anchor="end">25 kVA</text><text class="lab" x="1000" y="270" >T2 three-phase</text><text class="lab" x="1370" y="270" text-anchor="end">50 kVA ✓</text><text class="lab" x="1000" y="294" >Class A earth for the transformer room’s frames, class B for the</text><text class="lab" x="1000" y="306" >transformers’ neutrals, class D for the flats’ sockets and the lift;</text><text class="lab" x="1000" y="318" >lightning rod earth separate.</text><rect class="l" x="960" y="884" width="430" height="96" fill="#fff"/><rect class="t" x="960" y="884" width="180" height="30" /><text class="lab" x="963" y="892" font-size="6.5" fill="#6a7477">BUILDER</text><text class="txt" x="963" y="897" style="font-size:8px" >ヨハンソン建設</text><text class="ttl" x="963" y="910" style="font-size:12px" >JOHANSSON CONSTRUCTION</text><rect class="t" x="1140" y="884" width="160" height="30" /><text class="lab" x="1143" y="892" font-size="6.5" fill="#6a7477">PROJECT</text><text class="txt" x="1143" y="900" style="font-size:8px" >ヨハンソンハイツ港町</text><text class="txt" x="1143" y="910" style="font-size:7.43px" >JOHANSSON HEIGHTS MINATO · Minato-chō</text><rect class="t" x="1300" y="884" width="90" height="30" /><text class="lab" x="1303" y="892" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-E-01</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >ELECTRICAL SINGLE-LINE DIAGRAM</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >NTS</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >10 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="835" width="430" height="45" fill="#fff"/><text class="lab" x="965" y="843" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="854" >Voltage drop on a riser at full demand is under 1 V of 210 V. Night-rate risers run</text><text class="lab" x="965" y="865" >separately to the shafts’ night meters.</text><text class="lab" x="965" y="876" >The demand factor for the flats is assumed (finding AF2).</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>