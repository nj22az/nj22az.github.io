-LINE DIAGRAM</text><text class="lab" x="30" y="54" >6,600 V from the town’s feeder to the utility’s transformer room; 210/105 V to the flats, 210 V three-phase to the lift, pumps and shops.</text><text class="ttl" x="160" y="110" text-anchor="middle">TOWN 6.6 kV FEEDER</text><path class="hv" d="M160,118 L160,160" /><rect class="fx" x="146" y="160" width="28" height="24" /><text class="lab" x="182" y="176" >PAS (pole switch) · the town feeder’s plaza pole (x 5.2, z 28)</text><path class="hv" d="M160,184 L160,260" /><text class="lab" x="168" y="225" >CVT 38 mm², buried in a 100 mm duct, 18 m</text><rect class="h" x="40" y="260" width="560" height="190" /><text class="lab" x="46" y="274" >UTILITY TRANSFORMER ROOM (借室電気室) · the utility’s</text><rect class="fx" x="146" y="282" width="28" height="22" /><text class="lab" x="182" y="297" >LBS + fuses, VCT (utility’s metering)</text><path class="hv" d="M160,304 L160,330 L100,330 L100,360" /><path class="hv" d="M160,330 L360,330 L360,360" /><circle cx="100" cy="372" r="12" class="l" fill="#fff"/><circle cx="100" cy="390" r="12" class="l" fill="#fff"/><text class="lab" x="118" y="384" >T1 150 kVA · 1φ 6,600/210-105 V</text><text class="lab" x="118" y="396" >flats, night heaters, common lighting</text><circle cx="360" cy="372" r="12" class="l" fill="#fff"/><circle cx="360" cy="390" r="12" class="l" fill="#fff"/><text class="lab" x="378" y="384" >T2 50 kVA · 3φ 6,600/210 V</text><text class="lab" x="378" y="396" >lift, pumps, shops</text><rect class="fx" x="40" y="470" width="780" height="40" /><text class="ttl" x="46" y="486" font-size="9">LV BOARD (1φ3W 210/105 V) · electrical room</text><path class="pw" d="M100,402 L100,470" /><rect class="fx" x="840" y="470" width="300" height="40" /><text class="ttl" x="846" y="486" font-size="9">POWER BOARD (3φ 210 V)</text><path class="pw" d="M360,402 L360,440 L920,440 L920,470" /><path class="pw" d="M100,510 L100,700" /><text class="lab" x="106" y="530" >ER1 MCCB 250 A</text><text class="lab" x="106" y="542" >CV 150 mm² 3C · 206 A</text><text class="lab" x="106" y="554" >drop 0.98 V (40 m)</text><line class="pw" x1="100" y1="580" x2="130" y2="580" /><rect class="fx" x="130" y="574" width="16" height="12" /><text class="lab" x="150" y="584" >7F: 701, 702</text><line class="pw" x1="100" y1="600" x2="130" y2="600" /><rect class="fx" x="130" y="594" width="16" height="12" /><text class="lab" x="150" y="604" >6F: 601, 602</text><line class="pw" x1="100" y1="620" x2="130" y2="620" /><rect class="fx" x="130" y="614" width="16" height="12" /><text class="lab" x="150" y="624" >5F: 501, 502</text><line class="pw" x1="100" y1="640" x2="130" y2="640" /><rect class="fx" x="130" y="634" width="16" height="12" /><text class="lab" x="150" y="644" >4F: 401, 402</text><line class="pw" x1="100" y1="660" x2="130" y2="660" /><rect class="fx" x="130" y="654" width="16" height="12" /><text class="lab" x="150" y="664" >3F: 301, 302</text><line class="pw" x1="100" y1="680" x2="130" y2="680" /><rect class="fx" x="130" y="674" width="16" height="12" /><text class="lab" x="150" y="684" >2F: 201, 202</text><path class="pw" d="M210,510 L210,560" stroke-dasharray="5 3"/><text class="lab" x="214" y="570" >night 150 A</text><path class="pw" d="M290,510 L290,700" /><text class="lab" x="296" y="530" >ER2 MCCB 250 A</text><text class="lab" x="296" y="542" >CV 150 mm² 3C · 206 A</text><text class="lab" x="296" y="554" >drop 0.98 V (40 m)</text><line class="pw" x1="290" y1="580" x2="320" y2="580" /><rect class="fx" x="320" y="574" width="16" height="12" /><text class="lab" x="340" y="584" >7F: 703, 704</text><line class="pw" x1="290" y1="600" x2="320" y2="600" /><rect class="fx" x="320" y="594" width="16" height="12" /><text class="lab" x="340" y="604" >6F: 603, 604</text><line class="pw" x1="290" y1="620" x2="320" y2="620" /><rect class="fx" x="320" y="614" width="16" height="12" /><text class="lab" x="340" y="624" >5F: 503, 504</text><line class="pw" x1="290" y1="640" x2="320" y2="6