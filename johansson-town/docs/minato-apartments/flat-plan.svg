" /><line class="d" x1="878.9" y1="606.22" x2="869.3" y2="606.22" /><line class="d" x1="870.9" y1="872.98" x2="870.9" y2="606.22" marker-start="url(#arr)" marker-end="url(#arr)"/><text class="lab" x="867.9" y="739.6" text-anchor="middle" transform="rotate(-90 867.9 739.6)">3.42 clear</text><g transform="translate(1250,90)"><circle r="16" class="t"/><path d="M0,-14 L6,8 L0,3 L-6,8 z" fill="#1d2326"/><text class="ttl" x="0" y="-20" text-anchor="middle">N</text></g><rect class="t" x="1080" y="150" width="78" height="5" fill="#1d2326"/><rect class="t" x="1158" y="150" width="78" height="5" fill="#fff"/><text class="lab" x="1080" y="166" >0</text><text class="lab" x="1236" y="166" text-anchor="middle">2 m</text><text class="ttl" x="1010" y="230" font-size="11">THE FLAT</text><text class="lab" x="1010" y="242" >· PS / MB</text><text class="lab" x="1010" y="254" >· Steel entrance door 850, opens out, door scope, chain, dial lock</text><text class="lab" x="1010" y="266" >· Genkan (玄関): tiled at slab level, step up 150 to the raised floor</text><text class="lab" x="1010" y="278" >· Unit bath 1418 (WC, basin, bath with shower)</text><text class="lab" x="1010" y="290" >· Washing machine pan 640, with tap</text><text class="lab" x="1010" y="302" >· Water heater cupboard: 150 L electric storage, 2.0 kW, night rate</text><text class="lab" x="1010" y="314" >· Shoe cabinet</text><text class="lab" x="1010" y="326" >· Kitchenette 1800: under-counter fridge, sink, 2-ring IH hob, hood, wall</text><text class="lab" x="1010" y="338" >cupboard</text><text class="lab" x="1010" y="350" >· Wardrobe 700</text><text class="lab" x="1010" y="362" >· Aluminium sliding window to the balcony, 2.5 × 2.0 m, with net curtain</text><text class="lab" x="1010" y="374" >and blackout curtain</text><text class="lab" x="1010" y="386" >· Connecting door 800 in the shaft-side party wall by the window, clear of</text><text class="lab" x="1010" y="398" >the beds (a pair of flats for a family of three): opening cut in the RC</text><text class="lab" x="1010" y="410" >wall at build, a fire-rated leaf each side</text><text class="ttl" x="1010" y="430" font-size="10">TYPE A (double)</text><text class="lab" x="1010" y="442" style="font-size:8.5px" >· Double bed 1400 × 1950, headboard on the wall</text><text class="lab" x="1010" y="454" style="font-size:8.5px" >· Bedside table and lamp</text><text class="lab" x="1010" y="466" style="font-size:8.5px" >· Desk 1200 × 500 with chair, desk lamp and mirror</text><text class="lab" x="1010" y="478" style="font-size:8.5px" >· Desk chair</text><text class="lab" x="1010" y="490" style="font-size:8.5px" >· Low console: TV, luggage rack, minibar shelf</text><text class="lab" x="1010" y="502" style="font-size:8.5px" >· Armchair by the window</text><text class="lab" x="1010" y="514" style="font-size:8.5px" >· Round side table</text><text class="ttl" x="1010" y="532" font-size="10">TYPE B (twin)</text><text class="lab" x="1010" y="544" style="font-size:8.5px" >· Single bed 900 × 1950</text><text class="lab" x="1010" y="556" style="font-size:8.5px" >· Shared bedside table and lamp</text><text class="lab" x="1010" y="568" style="font-size:8.5px" >· Single bed 900 × 1950</text><text class="lab" x="1010" y="586" style="font-size:8.5px" >Floor: 200 slab, 150 raised floor; ceiling 2.4 m; genkan step 150.</text><rect class="l" x="960" y="884" width="430" height="96" fill="#fff"/><rect class="t" x="960" y="884" width="180" height="30" /><text class="lab" x="963" y="892" font-size="6.5" fill="#6a7477">BUILDER</text><text class="txt" x="963" y="897" style="font-size:8px" >ヨハンソン建設</text><text class="ttl" x="963" y="910" style="font-size:12px" >JOHANSSON CONSTRUCTION</text><rect class="t" x="1140" y="884" width="160" height="30" /><text class="lab" x="1143" y="892" font-size="6.5" fill="#6a7477">PROJECT</text><text class="txt" x="1143" y="900" style="font-size:8px" >ヨハンソンハイツ港町</text><text class="txt" x="1143" y="910" style="font-size:7.43px" >JOHANSSON HEIGHTS MINATO · Minato-chō</text><rect class="t" x="1300" y="884" width="90" height="30" /><text class="lab" x="1303" y="892" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-A-05</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >FLAT PLANS · TYPES A AND B (301, 302)</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >1:50 (78 px/m)</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >5 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="824" width="430" height="56" fill="#fff"/><text class="lab" x="965" y="832" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="843" >Flats 301 and 302 are the Higas’ connecting pair: Grandmother Higa in 301 (type A), Mrs</text><text class="lab" x="965" y="854" >Higa and Kenta in 302 (type B).</text><text class="lab" x="965" y="865" >Every flat is one of these two, mirrored about its shaft; furniture is the hotel set,</text><text class="lab" x="965" y="876" >the kitchenette is the serviced-apartment addition.</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>