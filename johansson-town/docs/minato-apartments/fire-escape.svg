xt-anchor="end" fill="#c0281e">dry riser</text><rect class="l" x="262.6" y="477" width="10" height="10" fill="#c0281e"/><text class="lab" x="275.6" y="485" fill="#c0281e">extinguisher</text><g transform="translate(1250,90)"><circle r="16" class="t"/><path d="M0,-14 L6,8 L0,3 L-6,8 z" fill="#1d2326"/><text class="ttl" x="0" y="-20" text-anchor="middle">N</text></g><rect class="t" x="1080" y="150" width="38" height="5" fill="#1d2326"/><rect class="t" x="1118" y="150" width="38" height="5" fill="#fff"/><rect class="t" x="1156" y="150" width="38" height="5" fill="#1d2326"/><rect class="t" x="1194" y="150" width="38" height="5" fill="#fff"/><rect class="t" x="1232" y="150" width="38" height="5" fill="#1d2326"/><text class="lab" x="1080" y="166" >0</text><text class="lab" x="1270" y="166" text-anchor="middle">5 m</text><text class="ttl" x="870" y="220" font-size="11">PROVISIONS</text><text class="ttl" x="870" y="238" font-size="9.5">Walking distance</text><text class="lab" x="870" y="250" >farthest flat door to the stair 11.26 m (limit 50 m)</text><text class="ttl" x="870" y="268" font-size="9.5">Balconies</text><text class="lab" x="870" y="280" >Breakable balcony partitions (隔て板, calcium silicate board 6 mm) between every pair of balconies,</text><text class="lab" x="870" y="292" >marked 非常の際はここを破って隣戸へ避難できます.</text><text class="ttl" x="870" y="310" font-size="9.5">Hatches</text><text class="lab" x="870" y="322" >An escape hatch (避難ハッチ) with a folding ladder in the balcony of flats x05 on 3F–7F, staggered so no</text><text class="lab" x="870" y="334" >hatch is over another’s ladder; flats x06 on 2F land on the ground.</text><text class="ttl" x="870" y="352" font-size="9.5">Connecting water pipe</text><text class="lab" x="870" y="364" >Connecting water pipe (連結送水管) 100A in the stair: the building has seven storeys above ground (Fire</text><text class="lab" x="870" y="376" >Service Act Order art. 29). Twin inlet at the ground floor’s south face, outlets on every floor from</text><text class="lab" x="870" y="388" >3F.</text><text class="ttl" x="870" y="406" font-size="9.5">Fire alarm</text><text class="lab" x="870" y="418" >Automatic fire alarm: a heat detector in every flat and shop, smoke detectors in the stair and lift</text><text class="lab" x="870" y="430" >machine room; panel in the caretaker’s office (over 500 m², Fire Service Act Order art. 21).</text><text class="ttl" x="870" y="448" font-size="9.5">Extinguishers</text><text class="lab" x="870" y="460" >A 10-type ABC extinguisher in the corridor at the stair on every floor, and one in each shop.</text><text class="ttl" x="870" y="478" font-size="9.5">Lights</text><text class="lab" x="870" y="490" >Emergency lights and exit signs in the stair, corridors and entrance hall, battery-backed.</text><rect class="l" x="960" y="884" width="430" height="96" fill="#fff"/><rect class="t" x="960" y="884" width="180" height="30" /><text class="lab" x="963" y="892" font-size="6.5" fill="#6a7477">BUILDER</text><text class="txt" x="963" y="897" style="font-size:8px" >ヨハンソン建設</text><text class="ttl" x="963" y="910" style="font-size:12px" >JOHANSSON CONSTRUCTION</text><rect class="t" x="1140" y="884" width="160" height="30" /><text class="lab" x="1143" y="892" font-size="6.5" fill="#6a7477">PROJECT</text><text class="txt" x="1143" y="900" style="font-size:8px" >ヨハンソンハイツ港町</text><text class="txt" x="1143" y="910" style="font-size:7.43px" >JOHANSSON HEIGHTS MINATO · Minato-chō</text><rect class="t" x="1300" y="884" width="90" height="30" /><text class="lab" x="1303" y="892" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-F-01</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >FIRE SAFETY AND ESCAPE</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >1:100 (38 px/m)</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >12 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="835" width="430" height="45" fill="#fff"/><text class="lab" x="965" y="843" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="854" >The stair is the one way down; the balconies give every flat a second way out (Building</text><text class="lab" x="965" y="865" >Standards Act Order art. 121).</text><text class="lab" x="965" y="876" >Every flat’s door is a fire door to the corridor; the stair door closes by itself.</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>