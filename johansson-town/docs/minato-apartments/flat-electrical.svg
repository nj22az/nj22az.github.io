d="M301.7,592.4 Q425.2,476.94 508.7,361.48" fill="none" stroke="#5c6366" stroke-width=".8" stroke-dasharray="4 2"/><circle cx="508.7" cy="361.48" r="6" fill="#fff" stroke="#5c6366" stroke-width="1.4"/><path d="M505.7,361.48 L511.7,361.48" stroke="#5c6366" stroke-width="1.4"/><path d="M301.7,592.4 Q335.5,511.44 329.3,430.48" fill="none" stroke="#2d7a3a" stroke-width=".8" stroke-dasharray="4 2"/><circle cx="329.3" cy="430.48" r="6" fill="#fff" stroke="#2d7a3a" stroke-width="1.4"/><path d="M326.3,430.48 L332.3,430.48" stroke="#2d7a3a" stroke-width="1.4"/><path d="M301.7,592.4 Q448.2,476.94 554.7,361.48" fill="none" stroke="#b8322a" stroke-width=".8" stroke-dasharray="4 2"/><rect class="l" x="548.7" y="355.48" width="12" height="12" fill="#fff" stroke="#b8322a"/><text class="lab" x="554.7" y="364.48" text-anchor="middle" font-size="7">□</text><circle cx="632.9" cy="453.48" r="8" fill="#fff" stroke="#c0281e" stroke-width="1.4"/><text class="lab" x="632.9" y="456.48" text-anchor="middle" font-size="8" fill="#c0281e">H</text><text class="ttl" x="1000" y="180" font-size="10">FLAT BOARD</text><text class="lab" x="1000" y="194" style="font-size:8.5px" >above the shoe cabinet in the genkan</text><text class="lab" x="1000" y="207" style="font-size:8.5px" >1φ3W 210/105 V, 30 A (6 kVA)</text><text class="lab" x="1000" y="220" style="font-size:8.5px" >30 A limiter (the utility’s) + 2P 30 A ELCB 30 mA</text><line class="l" x1="1000" y1="236" x2="1018" y2="236" stroke="#c07a12" stroke-width="2"/><text class="lab" x="1024" y="239" style="font-size:8.5px" >1. Lighting: room, genkan, balcony · 105 V · 20 A · VVF 1.6-2C</text><line class="l" x1="1000" y1="250" x2="1018" y2="250" stroke="#1f5fa8" stroke-width="2"/><text class="lab" x="1024" y="253" style="font-size:8.5px" >2. Sockets: room and desk · 105 V · 20 A · VVF 2.0-2C</text><line class="l" x1="1000" y1="264" x2="1018" y2="264" stroke="#2f6f74" stroke-width="2"/><text class="lab" x="1024" y="267" style="font-size:8.5px" >3. Sockets: kitchenette and fridge · 105 V · 20 A · VVF 2.0-2C</text><line class="l" x1="1000" y1="278" x2="1018" y2="278" stroke="#8e3a30" stroke-width="2"/><text class="lab" x="1024" y="281" style="font-size:8.5px" >4. IH hob, 2 rings (2.9 kW) · 210 V · 20 A · VVF 2.0-3C (E)</text><line class="l" x1="1000" y1="292" x2="1018" y2="292" stroke="#6a4c9c" stroke-width="2"/><text class="lab" x="1024" y="295" style="font-size:8.5px" >5. Air conditioner (2.2 kW) · 105 V · 20 A · VVF 2.0-3C (E)</text><line class="l" x1="1000" y1="306" x2="1018" y2="306" stroke="#2d7a3a" stroke-width="2"/><text class="lab" x="1024" y="309" style="font-size:8.5px" >6. Unit bath: light, fan, WC seat socket · 105 V · 20 A · VVF 2.0-3C (E)</text><line class="l" x1="1000" y1="320" x2="1018" y2="320" stroke="#5c6366" stroke-width="2"/><text class="lab" x="1024" y="323" style="font-size:8.5px" >7. Washing machine socket (earthed) · 105 V · 20 A · VVF 2.0-3C (E)</text><line class="l" x1="1000" y1="334" x2="1018" y2="334" stroke="#b8322a" stroke-width="2"/><text class="lab" x="1024" y="337" style="font-size:8.45px" >N. Water heater 150 L, 2.0 kW, 23:00–07:00 · 210 V · 20 A · VVF 2.0-3C (E)</text><text class="ttl" x="1000" y="365" font-size="10">POINTS</text><text class="lab" x="1000" y="377" style="font-size:8px" >· Flat board (limiter, ELCB, 7 + 1 circuits)</text><text class="lab" x="1000" y="389" style="font-size:8px" >· Intercom handset (autolock)</text><text class="lab" x="1000" y="401" style="font-size:8px" >· Switches: genkan, hall, room</text><text class="lab" x="1000" y="413" style="font-size:8px" >· Genkan downlight (circuit 1)</text><text class="lab" x="1000" y="425" style="font-size:8px" >· Hall downlight (circuit 1)</text><text class="lab" x="1000" y="437" style="font-size:8px" >· Room ceiling light (circuit 1)</text><text class="lab" x="1000" y="449" style="font-size:8px" >· Kitchenette light under the cupboard (circuit 1)</text><text class="lab" x="1000" y="461" style="font-size:8px" >· Balcony light (circuit 1)</text><text class="lab" x="1000" y="473" style="font-size:8px" >· Unit bath light and fan (circuit 6)</text><text class="lab" x="1000" y="485" style="font-size:8px" >· Desk: double socket, phone and data (circuit 2)</text><text class="lab" x="1000" y="497" style="font-size:8px" >· Bedside double socket (circuit 2)</text><text class="lab" x="1000" y="509" style="font-size:8px" >· TV: double socket and aerial outlet (circuit 2)</text><text class="lab" x="1000" y="521" style="font-size:8px" >· Fridge socket (circuit 3)</text><text class="lab" x="1000" y="533" style="font-size:8px" >· Counter double socket (circuit 3)</text><text class="lab" x="1000" y="545" style="font-size:8px" >· IH hob 200 V outlet (circuit 4)</text><text class="lab" x="1000" y="557" style="font-size:8px" >· Air conditioner outlet, high (circuit 5)</text><text class="lab" x="1000" y="569" style="font-size:8px" >· Washing machine socket (earthed) (circuit 7)</text><text class="lab" x="1000" y="581" style="font-size:8px" >· WC seat socket in the unit bath (earthed) (circuit 6)</text><text class="lab" x="1000" y="593" style="font-size:8px" >· Water heater 200 V (night rate) (circuit night)</text><text class="lab" x="1000" y="605" style="font-size:8px" >· Heat detector</text><rect class="l" x="960" y="884" width="430" height="96" fill="#fff"/><rect class="t" x="960" y="884" width="180" height="30" /><text class="lab" x="963" y="892" font-size="6.5" fill="#6a7477">BUILDER</text><text class="txt" x="963" y="897" style="font-size:8px" >ヨハンソン建設</text><text class="ttl" x="963" y="910" style="font-size:12px" >JOHANSSON CONSTRUCTION</text><rect class="t" x="1140" y="884" width="160" height="30" /><text class="lab" x="1143" y="892" font-size="6.5" fill="#6a7477">PROJECT</text><text class="txt" x="1143" y="900" style="font-size:8px" >ヨハンソンハイツ港町</text><text class="txt" x="1143" y="910" style="font-size:7.43px" >JOHANSSON HEIGHTS MINATO · Minato-chō</text><rect class="t" x="1300" y="884" width="90" height="30" /><text class="lab" x="1303" y="892" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-E-02</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >FLAT ELECTRICAL PLAN</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >1:40 (92 px/m)</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >11 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="824" width="430" height="56" fill="#fff"/><text class="lab" x="965" y="832" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="843" >Cables run in the ceiling void and down in the walls; sockets in the kitchenette, unit</text><text class="lab" x="965" y="854" >bath and washer place are earthed and on the 30 mA earth-leakage breaker.</text><text class="lab" x="965" y="865" >The water heater is on its own night-rate meter in the shaft, switched by the utility’s</text><text class="lab" x="965" y="876" >time switch.</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>