ont-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-P-01</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >COLD WATER SUPPLY · RISER DIAGRAM</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >NTS</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >7 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="824" width="430" height="56" fill="#fff"/><text class="lab" x="965" y="832" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="843" >Two pumps, each able to carry the peak, alternate on every start; the pressure tank</text><text class="lab" x="965" y="854" >keeps them from cycling at night.</text><text class="lab" x="965" y="865" >The tank’s overflow and drain go to the floor gully through an air break, never</text><text class="lab" x="965" y="876" >straight to a drain.</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>