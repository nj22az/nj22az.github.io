lot Rainflower Lane leaves</text><text class="lab" x="30" y="54" >World coordinates in brackets; building frame origin at (-1.4, 31).</text><rect class="zone" x="45.6" y="190" width="158.4" height="528" /><text class="lab" x="55.2" y="382" transform="rotate(-90 55.2 382)">AOBA GARDEN</text><rect class="zone" x="79.2" y="838" width="542.4" height="72" /><text class="lab" x="189.6" y="886" >BUS STATION PLAZA · head of Main Street (continues south)</text><text class="lab" x="381.6" y="142" text-anchor="middle">↑ Kitahama walk</text><text class="lab" x="633.6" y="526" >east lawn →</text><rect class="h" x="225.6" y="247.6" width="374.4" height="566.4" /><text class="lab" x="229.6" y="241.6" >PLOT (Rainflower Lane, removed) x -4.5…11.1, z 30…53.6</text><rect class="zone" x="300" y="271.6" width="229.2" height="518.4" fill="#e6e0d2"/><rect class="cut" x="232.8" y="434.8" width="67.2" height="177.6" /><text class="ttl" x="415.2" y="526" text-anchor="middle" font-size="11">JOHANSSON HEIGHTS MINATO</text><text class="lab" x="415.2" y="539" text-anchor="middle">7 storeys · 36 flats · shops on 1F</text><rect class="fx" x="540" y="574" width="48" height="168" stroke-dasharray="3 2"/><text class="lab" x="564" y="658" text-anchor="middle" font-size="7">TREATMENT</text><text class="lab" x="564" y="667" text-anchor="middle" font-size="7">TANK 75p</text><circle cx="458.4" cy="862" r="5" fill="#8e3a30"/><text class="lab" x="466.4" y="866" >feeder pole, PAS (5.2, 28)</text><path class="hv" d="M458.4,862 L458.4,804.4 L516,804.4 L516,487.6 L500.4,487.6" /><text class="lab" x="520.8" y="521.2" fill="#8e3a30">6.6 kV buried</text><path class="cold" d="M285.6,847.6 L285.6,401.2 L328.8,401.2" /><text class="lab" x="290.4" y="852.4" fill="#1f5fa8">water main 50A, meter</text><path class="waste" d="M564,742 L564,850" /><text class="lab" x="568.8" y="838" fill="#7a5230">treated water → storm drain</text><path class="waste" d="M534,358 L534,574" /><text class="lab" x="536.4" y="382" fill="#7a5230">building drain 125A</text><line class="d" x1="300" y1="790" x2="300" y2="763.6" /><line class="d" x1="529.2" y1="790" x2="529.2" y2="763.6" /><line class="d" x1="300" y1="768" x2="529.2" y2="768" marker-start="url(#arr)" marker-end="url(#arr)"/><text class="lab" x="414.6" y="765" text-anchor="middle">9.55</text><line class="d" x1="232.8" y1="790" x2="201.6" y2="790" /><line class="d" x1="232.8" y1="271.6" x2="201.6" y2="271.6" /><line class="d" x1="206.8" y1="790" x2="206.8" y2="271.6" marker-start="url(#arr)" marker-end="url(#arr)"/><text class="lab" x="203.8" y="530.8" text-anchor="middle" transform="rotate(-90 203.8 530.8)">21.60</text><line class="d" x1="232.8" y1="434.8" x2="232.8" y2="456.4" /><line class="d" x1="300" y1="434.8" x2="300" y2="456.4" /><line class="d" x1="232.8" y1="452.8" x2="300" y2="452.8" marker-start="url(#arr)" marker-end="url(#arr)"/><text class="lab" x="266.4" y="449.8" text-anchor="middle">2.80</text><g transform="translate(1250,90)"><circle r="16" class="t"/><path d="M0,-14 L6,8 L0,3 L-6,8 z" fill="#1d2326"/><text class="ttl" x="0" y="-20" text-anchor="middle">N</text></g><rect class="t" x="1100" y="150" width="24" height="5" fill="#1d2326"/><rect class="t" x="1124" y="150" width="24" height="5" fill="#fff"/><rect class="t" x="1148" y="150" width="24" height="5" fill="#1d2326"/><rect class="t" x="1172" y="150" width="24" height="5" fill="#fff"/><rect class="t" x="1196" y="150" width="24" height="5" fill="#1d2326"/><text class="lab" x="1100" y="166" >0</text><text class="lab" x="1220" y="166" text-anchor="middle">5 m</text><text class="ttl" x="830" y="230" font-size="10">Name</text><text class="txt" x="930" y="230" style="font-size:10px" >Johansson Heights Minato · ヨハンソンハイツ港町</text><text class="ttl" x="830" y="250" font-size="10">Builder</text><text class="txt" x="930" y="250" style="font-size:10px" >Johansson Construction (Naha works) · ヨハンソン建設, 1991</text><text class="ttl" x="830" y="270" font-size="10">Structure</text><text class="txt" x="930" y="270" style="font-size:9.47px" >Reinforced concrete, moment frame (columns and beams); RC slabs; party walls RC 180</text><text class="ttl" x="830" y="290" font-size="10">Storeys</text><text class="txt" x="930" y="290" style="font-size:10px" >7 above ground, none below · roof at +21 m, top of the machine room +23.8 m</text><text class="ttl" x="830" y="310" font-size="10">Flats</text><text class="txt" x="930" y="310" style="font-size:10px" >36: 23.94 m² inside + 3.86 m² balcony each</text><text class="ttl" x="830" y="330" font-size="10">People</text><text class="txt" x="930" y="330" style="font-size:10px" >49 residents in 30 households; flat 706 to let</text><text class="ttl" x="830" y="350" font-size="10">Ground floor</text><text class="txt" x="930" y="350" style="font-size:10px" >+0.1 m above the town datum (the lane’s −0.40 regraded)</text><rect class="l" x="960" y="884" width="430" height="96" fill="#fff"/><rect class="t" x="960" y="884" width="180" height="30" /><text class="lab" x="963" y="892" font-size="6.5" fill="#6a7477">BUILDER</text><text class="txt" x="963" y="897" style="font-size:8px" >ヨハンソン建設</text><text class="ttl" x="963" y="910" style="font-size:12px" >JOHANSSON CONSTRUCTION</text><rect class="t" x="1140" y="884" width="160" height="30" /><text class="lab" x="1143" y="892" font-size="6.5" fill="#6a7477">PROJECT</text><text class="txt" x="1143" y="900" style="font-size:8px" >ヨハンソンハイツ港町</text><text class="txt" x="1143" y="910" style="font-size:7.43px" >JOHANSSON HEIGHTS MINATO · Minato-chō</text><rect class="t" x="1300" y="884" width="90" height="30" /><text class="lab" x="1303" y="892" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-A-01</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >SITE PLAN</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >1:400 (24 px/m)</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >1 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="824" width="430" height="56" fill="#fff"/><text class="lab" x="965" y="832" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="843" >The building stands on the plot of Rainflower Lane, which is removed; Blue Coral and</text><text class="lab" x="965" y="854" >Rainflower Florist move into its ground floor.</text><text class="lab" x="965" y="865" >Services come from the plaza: water main, the town’s 6.6 kV feeder pole, and the storm</text><text class="lab" x="965" y="876" >drain that takes the treated water.</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>