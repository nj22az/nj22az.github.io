N · flat 301 (all flats alike, mirrored)</text><text class="lab" x="30" y="54" >Pipes under the 150 mm raised floor; none under the genkan, which is at slab level.</text><rect class="t" x="120" y="288.8" width="878.6" height="331.2" fill="#fff"/><rect class="cut" x="223.5" y="536.28" width="13.8" height="83.72" /><rect class="cut" x="223.5" y="288.8" width="13.8" height="169.28" /><rect class="cut" x="881.3" y="568.48" width="13.8" height="51.52" /><rect class="cut" x="881.3" y="288.8" width="13.8" height="49.68" /><rect class="t" x="885.44" y="338.48" width="5.52" height="230" fill="#fff"/><rect class="cut" x="230.4" y="611.72" width="768.2" height="16.56" /><rect class="cut" x="230.4" y="280.52" width="657.8" height="16.56" /><line class="h" x1="888.2" y1="288.8" x2="998.6" y2="288.8" /><rect class="zone" x="237.3" y="297.08" width="46" height="37.72" /><path class="t" d="M237.3,334.8 L283.3,297.08" /><rect class="t" x="237.3" y="439.68" width="101.2" height="172.04" stroke-dasharray="2 2"/><rect class="fx" x="287.9" y="297.08" width="170.2" height="133.4" /><rect class="t" x="297.1" y="306.28" width="82.8" height="69" rx="4"/><rect class="fx" x="462.7" y="297.08" width="59.8" height="64.4" /><rect class="fx" x="522.5" y="297.08" width="59.8" height="64.4" /><circle class="t" cx="551.94" cy="329.28" r="24.84"/><rect class="fx" x="260.3" y="573.08" width="78.2" height="38.64" /><rect class="fx" x="347.7" y="556.52" width="165.6" height="55.2" /><rect class="fx" x="517.9" y="556.52" width="64.4" height="55.2" /><rect class="fu" x="614.5" y="297.08" width="128.8" height="179.4" /><rect class="fu" x="747.9" y="297.08" width="41.4" height="41.4" /><rect class="fu" x="596.1" y="565.72" width="110.4" height="46" /><rect class="fu" x="628.3" y="513.28" width="46" height="46" /><rect class="fu" x="720.3" y="570.32" width="101.2" height="41.4" /><rect class="fu" x="826.1" y="513.28" width="50.6" height="69" /><rect class="fu" x="827.94" y="453.48" width="48.76" height="50.6" /><path class="cold" d="M260.3,315.48 L292.5,315.48"/><path class="cold" d="M292.5,315.48 L292.5,375.28 L462.7,375.28 L462.7,329.28"/><path class="cold" d="M462.7,375.28 L540.9,375.28 L540.9,343.08"/><path class="cold" d="M462.7,375.28 L462.7,545.48 L430.5,545.48 L430.5,573.08"/><path class="hot" d="M554.7,343.08 L554.7,389.08 L366.1,389.08 L366.1,379.88"/><path class="hot" d="M471.9,389.08 L471.9,550.08 L439.7,550.08 L439.7,573.08"/><path class="waste" d="M375.3,361.48 L375.3,324.68 L264.9,324.68"/><path class="waste" d="M494.9,329.28 L494.9,306.28 L384.5,306.28"/><path class="waste" d="M421.3,582.28 L481.1,582.28 L481.1,352.28 L402.9,352.28"/><circle cx="260.3" cy="315.48" r="7" fill="#fff" stroke="#7a5230" stroke-width="2"/><text class="lab" x="260.3" y="303.48" text-anchor="middle">SS 100A + WR 40A</text><text class="ttl" x="1000" y="200" font-size="10">LEGEND</text><line class="cold" x1="1000" y1="214" x2="1040" y2="214" /><text class="lab" x="1050" y="218" >Cold water · 20A → 13A</text><line class="hot" x1="1000" y1="232" x2="1040" y2="232" /><text class="lab" x="1050" y="236" >Hot water · 15A</text><line class="waste" x1="1000" y1="250" x2="1040" y2="250" /><text class="lab" x="1050" y="254" >Soil and waste · 50A / 40A, 1/50; WC 75A</text><text class="ttl" x="1000" y="280" font-size="10">FIXTURES</text><text class="lab" x="1000" y="294" style="font-size:8.5px" >· Unit bath 1418 (WC, basin, bath with shower)</text><text class="lab" x="1000" y="308" style="font-size:8.5px" >· Washing machine pan 640, with tap</text><text class="lab" x="1000" y="322" style="font-size:8.5px" >· Water heater cupboard: 150 L electric storage, 2.0 kW, night rate</text><text class="lab" x="1000" y="336" style="font-size:8.06px" >· Kitchenette 1800: under-counter fridge, sink, 2-ring IH hob, hood, wall cupboard</text><text class="ttl" x="1000" y="358" font-size="10">WATER HEATER</text><text class="lab" x="1000" y="372" style="font-size:8.5px" >150 L, 20→85 °C needs 11.93 kWh; 2 kW × 7 h night gives 14 kWh.</text><text class="lab" x="1000" y="386" style="font-size:8.16px" >The heater’s relief valve to the washing machine pan’s trap through an air break.</text><rect class="l" x="960" y="884" width="430" height="96" fill="#fff"/><rect class="t" x="960" y="884" width="180" height="30" /><text class="lab" x="963" y="892" font-size="6.5" fill="#6a7477">BUILDER</text><text class="txt" x="963" y="897" style="font-size:8px" >ヨハンソン建設</text><text class="ttl" x="963" y="910" style="font-size:12px" >JOHANSSON CONSTRUCTION</text><rect class="t" x="1140" y="884" width="160" height="30" /><text class="lab" x="1143" y="892" font-size="6.5" fill="#6a7477">PROJECT</text><text class="txt" x="1143" y="900" style="font-size:8px" >ヨハンソンハイツ港町</text><text class="txt" x="1143" y="910" style="font-size:7.43px" >JOHANSSON HEIGHTS MINATO · Minato-chō</text><rect class="t" x="1300" y="884" width="90" height="30" /><text class="lab" x="1303" y="892" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1303" y="910" style="font-size:12px" >JC-H01-P-03</text><rect class="t" x="960" y="914" width="340" height="30" /><text class="lab" x="963" y="922" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="963" y="940" style="font-size:9px" >FLAT PLUMBING PLAN</text><rect class="t" x="1300" y="914" width="90" height="30" /><text class="lab" x="1303" y="922" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1303" y="940" style="font-size:9px" >1:40 (92 px/m)</text><rect class="t" x="960" y="944" width="80" height="36" /><text class="lab" x="963" y="952" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="963" y="976" style="font-size:4.72px" >tools/apartment-drawings.mjs</text><rect class="t" x="1040" y="944" width="70" height="36" /><text class="lab" x="1043" y="952" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="1043" y="976" style="font-size:8.16px" >numeric checks</text><rect class="t" x="1110" y="944" width="70" height="36" /><text class="lab" x="1113" y="952" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="1113" y="976" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1180" y="944" width="70" height="36" /><text class="lab" x="1183" y="952" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1183" y="976" style="font-size:9px" >2026-10-13</text><rect class="t" x="1250" y="944" width="60" height="36" /><text class="lab" x="1253" y="952" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1253" y="976" style="font-size:9px" >9 / 12</text><rect class="t" x="1310" y="944" width="80" height="36" /><text class="lab" x="1313" y="952" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1313" y="976" style="font-size:8.81px" >A · first issue</text><rect class="t" x="960" y="824" width="430" height="56" fill="#fff"/><text class="lab" x="965" y="832" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="965" y="843" >Waste falls 1/50 to the stack; the longest run (the kitchenette) is 3.9 m and drops 78</text><text class="lab" x="965" y="854" >mm inside the 150 mm floor void.</text><text class="lab" x="965" y="865" >The shaft holds the flat’s 20 mm meter and stop valve, read from the corridor without</text><text class="lab" x="965" y="876" >entering the flat.</text><text x="16" y="974" font-size="8" fill="#9b3030">FOR DESIGN REVIEW · Rev A · a game asset's design basis, not for construction · metres unless noted</text></svg>