 pump (circle, triangle), M its motor, E engine-driven; valve (bowtie), non-return (dot), QC quick-closing, safety (spring); strainer, filter,</text><text class="lab" x="60" y="868" >cooler, tank with level, sea chest, OB overboard, deck connection (flange), manifold (bar), hydrant (H).</text><rect class="l" x="830" y="1050" width="420" height="96" fill="#fff"/><rect class="t" x="830" y="1050" width="180" height="30"/><text class="lab" x="833" y="1058" font-size="6.5" fill="#6a7477">YARD</text><text class="txt" x="833" y="1063" style="font-size:8px" >ヨハンソン造船 · Innoshima</text><text class="ttl" x="833" y="1076" style="font-size:12px" >JOHANSSON SHIPYARD</text><rect class="t" x="1010" y="1050" width="160" height="30"/><text class="lab" x="1013" y="1058" font-size="6.5" fill="#6a7477">SHIP</text><text class="txt" x="1013" y="1076" style="font-size:7.21px" >M/V MINATO MARU みなと丸 · hull No. 127</text><rect class="t" x="1170" y="1050" width="80" height="30"/><text class="lab" x="1173" y="1058" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1173" y="1076" style="font-size:11.01px" >JS-127-08-08</text><rect class="t" x="830" y="1080" width="340" height="30"/><text class="lab" x="833" y="1088" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="833" y="1106" style="font-size:9px" >PIPING DIAGRAM · Fresh water</text><rect class="t" x="1170" y="1080" width="80" height="30"/><text class="lab" x="1173" y="1088" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1173" y="1106" style="font-size:9px" >as noted</text><rect class="t" x="830" y="1110" width="70" height="36"/><text class="lab" x="833" y="1118" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="833" y="1142" style="font-size:4.76px" >tools/ferry-drawings.mjs</text><rect class="t" x="900" y="1110" width="70" height="36"/><text class="lab" x="903" y="1118" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="903" y="1142" style="font-size:4.97px" >te