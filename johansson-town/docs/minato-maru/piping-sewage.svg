ck connection to the quay’s</text><text class="lab" x="970" y="267" style="font-size:7.5px" text-anchor="middle">sewage truck · after the last boat</text><text class="lab" x="970" y="276" text-anchor="middle" font-size="6.5" font-style="italic" fill="#6f7476">car deck</text><path d="M960,421 L976,421 L982,428 L976,435 L960,435 z" stroke="#7a756a" fill="#fff" stroke-width="1.2"/><text class="lab" x="968" y="431" text-anchor="middle" font-size="7">OB</text><text class="lab" x="970" y="408" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="8.5">10GRA10 AA502</text><text class="lab" x="970" y="450" style="font-size:7.5px" text-anchor="middle">Overboard · blanked and sealed</text><text class="lab" x="970" y="459" style="font-size:7.5px" text-anchor="middle">(never inside the strait)</text><text class="lab" x="970" y="468" text-anchor="middle" font-size="6.5" font-style="italic" fill="#6f7476">aux room</text><rect class="t" x="920" y="538" width="320" height="150"/><text class="sub" x="930" y="554" >DUTY AND STANDBY (FERRY_SERVICES)</text><text class="lab" x="930" y="570" style="font-size:8.5px" >Sanitary flushing: 10GHB10 AP001 duty · 10GHB10 AP002 standby</text><text class="lab" x="938" y="579" style="font-size:7.5px" fill="#4a5457">weekly</text><text class="lab" x="930" y="592" style="font-size:8.5px" >Sewage discharge: 10GRA10 AP001 duty · 10GRA10 AP002 standby</text><text class="lab" x="938" y="601" style="font-size:7.5px" fill="#4a5457">alternate discharges</text><rect class="t" x="50" y="538" width="780" height="150"/><text class="sub" x="60" y="554" >READING A TAG · KKS (VGB-B 105)</text><text class="lab" x="60" y="570" >10GHB10 AP001  =  Minato Maru · common · Sea-water distribution not for drinking: sanitary flushing 10 · pump unit 001</text><text class="lab" x="60" y="602" >G F0 FFF NN · AA NNN · BB NN: plant (1 the ship) · identical system (0 common, 1 port main, 2 starboard main, 3 generator No.1, 4 generator No.2) · function key ·</text><text class="lab" x="60" y="612" >subsystem decade · equipment key and number · component</text><text class="lab" x="60" y="634" >AA valves: 1xx electric actuator, 2xx pneumatic/hydraulic/solenoid, 4xx drain and vent, 5xx hand, 6xx mechanical (thermostat), 9xx safety. C* measuring: 0xx remote</text><text class="lab" x="60" y="644" >analogue, 3xx remote binary (switch), 5xx local.</text><text class="lab" x="60" y="666" >Symbols after ISO 10628: pump (circle, triangle), M its motor, E engine-driven; valve (bowtie), non-return (dot), QC quick-closing, safety (spring); strainer, filter,</text><text class="lab" x="60" y="676" >cooler, tank with level, sea chest, OB overboard, deck connection (flange), manifold (bar), hydrant (H).</text><rect class="l" x="830" y="858" width="420" height="96" fill="#fff"/><rect class="t" x="830" y="858" width="180" height="30"/><text class="lab" x="833" y="866" font-size="6.5" fill="#6a7477">YARD</text><text class="txt" x="833" y="871" style="font-size:8px" >ヨハンソン造船 · Innoshima</text><text class="ttl" x="833" y="884" style="font-size:12px" >JOHANSSON SHIPYARD</text><rect class="t" x="1010" y="858" width="160" height="30"/><text class="lab" x="1013" y="866" font-size="6.5" fill="#6a7477">SHIP</text><text class="txt" x="1013" y="884" style="font-size:7.21px" >M/V MINATO MARU みなと丸 · hull No. 127</text><rect class="t" x="1170" y="858" width="80" height="30"/><text class="lab" x="1173" y="866" font-size="6.5" fill="#6a7477">DRAWING No.</text><text class="ttl" x="1173" y="884" style="font-size:11.01px" >JS-127-08-09</text><rect class="t" x="830" y="888" width="340" height="30"/><text class="lab" x="833" y="896" font-size="6.5" fill="#6a7477">TITLE</text><text class="txt" x="833" y="914" style="font-size:9px" >PIPING DIAGRAM · Sanitary water and sewage</text><rect class="t" x="1170" y="888" width="80" height="30"/><text class="lab" x="1173" y="896" font-size="6.5" fill="#6a7477">SCALE</text><text class="txt" x="1173" y="914" style="font-size:7.77px" >NTS (SVG preview)</text><rect class="t" x="830" y="918" width="70" height="36"/><text class="lab" x="833" y="926" font-size="6.5" fill="#6a7477">DRAWN</text><text class="txt" x="833" y="950" style="font-size:4.76px" >tools/ferry-drawings.mjs</text><rect class="t" x="900" y="918" width="70" height="36"/><text class="lab" x="903" y="926" font-size="6.5" fill="#6a7477">CHECKED</text><text class="txt" x="903" y="950" style="font-size:6.72px" >AI numeric review</text><rect class="t" x="970" y="918" width="70" height="36"/><text class="lab" x="973" y="926" font-size="6.5" fill="#6a7477">ISSUE</text><text class="txt" x="973" y="950" style="font-size:8.79px" >DESIGN REVIEW</text><rect class="t" x="1040" y="918" width="70" height="36"/><text class="lab" x="1043" y="926" font-size="6.5" fill="#6a7477">DATE</text><text class="txt" x="1043" y="950" style="font-size:9px" >2026-10-13</text><rect class="t" x="1110" y="918" width="60" height="36"/><text class="lab" x="1113" y="926" font-size="6.5" fill="#6a7477">SHEET</text><text class="txt" x="1113" y="950" style="font-size:9px" >8.9 / 20</text><rect class="t" x="1170" y="918" width="80" height="36"/><text class="lab" x="1173" y="926" font-size="6.5" fill="#6a7477">REV</text><text class="txt" x="1173" y="950" style="font-size:9px" >B · correction</text><rect class="t" x="830" y="798" width="420" height="56" fill="#fff"/><text class="lab" x="835" y="806" font-size="6.5" fill="#6a7477">NOTES</text><text class="lab" x="835" y="817" >Nothing goes into the strait: the tank is pumped to the truck at Minato; the</text><text class="lab" x="835" y="828" >overboard is sealed with the inspector’s seal.</text><text class="lab" x="835" y="839" >Nodes and lines: FERRY_PIPING (src/world/ferry-piping.js); tags: ferry-kks.js. Bores</text><text class="lab" x="835" y="850" >in mm (DN). A dashed line is not a pipe (a wire, a can, a cable).</text><text x="16" y="948" font-size="8" fill="#9b3030">FOR DESIGN REVIEW - schematic game reference; no construction approval; SVG views NTS</text></svg>