ing: car deck · 0.96 kW · 10.2 A</text><text class="lab" x="440" y="345" >Lighting: engine room, steering-gear room · 1.06 kW · 11.2 A</text><text class="lab" x="440" y="356" >Lighting: bridge, mess, galley, cabins · 0.42 kW · 4.4 A</text><text class="lab" x="440" y="367" >Deck lights and ramp floodlights (6 × 100 W + 4 × 500 W) · 2.6 kW · 27.5 A</text><text class="lab" x="440" y="378" >Searchlight · 1 kW · 9.5 A</text><text class="lab" x="440" y="389" >Bridge electronics (radar, autopilot, echo sounder, GPS, NAVTEX, PA) · 0.75 kW · 7.9 A</text><text class="lab" x="440" y="400" >4× Room air conditioners (bridge, mess, cabins) · 1 kW · 11.2 A</text><text class="lab" x="440" y="411" >Galley appliances (rice cooker, microwave, pot, fridge, hood) · 4 kW · 38.1 A · trip st.2</text><text class="lab" x="440" y="422" >Kiosk (ice-cream freezer, showcase, hot water) · 1.9 kW · 18.1 A · trip st.1</text><text class="lab" x="440" y="433" >2× Drink vending machines · 0.6 kW · 6.7 A · trip st.1</text><text class="lab" x="440" y="444" >Carpet-room television · 0.08 kW · 0.8 A</text><text class="lab" x="440" y="455" >2× Toilet exhaust fans · 0.15 kW · 1.7 A</text><line class="l" x1="740" y1="150" x2="740" y2="200"/><rect class="sp" x="690" y="200" width="120" height="40" rx="3"/><text class="lab" x="696" y="214" >BUS-TIE to ESB</text><text class="lab" x="696" y="226" >opens on main-bus loss</text><line class="l" x1="750" y1="240" x2="750" y2="560"/><rect class="sp" x="900" y="480" width="220" height="52" rx="3"/><text class="lab" x="906" y="494" >EMERGENCY GENERATOR 40 kVA</text><text class="lab" x="906" y="506" >32 kW · on load within 45 s</text><text class="lab" x="906" y="518" >day tank 60 L · 15 h</text><line class="l" x1="1000" y1="532" x2="1000" y2="560"/><rect class="l" x="700" y="560" width="440" height="10" fill="#1d2326"/><text class="lab" x="700" y="586" >EMERGENCY SWITCHBOARD (ESB) · 440 V and 105 V sections · emergency-generator room (bridge deck)</text><line class="l" 