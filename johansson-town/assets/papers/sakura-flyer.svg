<text x="78" y="765" font-size="32" font-weight="900">STAMP, SMILE, SIP!</text><text x="78" y="809" font-size="24">One stamp per ¥300 spent in a visit.</text><text x="78" y="849" font-size="29" font-weight="bold">10 stamps = a FREE green tea!</text><text x="78" y="884" font-size="20">Bring your card to Thuan at the till.</text>
