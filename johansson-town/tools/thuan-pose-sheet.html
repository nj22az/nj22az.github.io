<!doctype html><html><head><meta charset="utf-8"><title>Thuận — shared game poses</title><style>body{margin:0;background:#f4efe6;color:#263044;font:16px Arial}canvas{display:block}header{height:60px;box-sizing:border-box;padding:18px 26px;font-size:23px}header span{float:right;font-size:14px;margin-top:6px}#labels{position:absolute;top:60px;left:0;pointer-events:none}.label{position:absolute;padding:12px 16px;box-sizing:border-box;font-size:14px;color:#354153;background:linear-gradient(#f4efe6dd,transparent)}</style></head><body><header>Thuận <span>Johansson Town · actual avatar assets</span></header><div id="labels"></div><script type="module">
import * as THREE from '../vendor/three.module.js';import {buildAvatar} from '../src/avatars/build.js';import {recipeFor,ORIGINAL_THUAN_RECIPE} from '../src/avatars/cast.js';import {HARBOUR_POLO_OUTFIT} from '../src/avatars/outfits.js';import {createAvatarAnimator} from '../src/avatars/animate.js';
const W=1260,H=1200;const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);renderer.setScissorTest(true);
const cells=[{x:0,y:0,w:420,h:1200,label:'Navy polo · cream pleats',pose:null,mood:'smile',turn:-.12},...[
 ['Heel kick','HeelKick','happy',0],['Hand by cheek','Peace','shy',-.12],['Side view','Coy','smile',-.6],['Wave','Wave','laugh',0],['Hand on cheek','CheekRest','smile',0],['Seated','CheekRest','content',-.18],['Both hands on cheeks','DoubleCheek','happy',0],['Surprised','DoubleCheek','surprised',0],['Hands together','Heart','happy',0]
].map(([label,pose,mood,turn],i)=>({x:420+(i%3)*280,y:Math.floor(i/3)*400,w:280,h:400,label,pose,mood,turn,seated:i===5}))];
for(const c of cells){const scene=new THREE.Scene();scene.background=new THREE.Color(c.label==='Surprised'?0xe9c9bc:0xe7e3d9);scene.add(new THREE.HemisphereLight(0xffffff,0x8d8777,2));const light=new THREE.DirectionalLight(0xffffff,2.1);light.position.set(3,6,5);scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0xcec1a9}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const r=new URLSearchParams(location.search).get('version')==='original'?structuredClone(ORIGINAL_THUAN_RECIPE):recipeFor('Thuan');r.outfit={...r.outfit,...HARBOUR_POLO_OUTFIT};const a=buildAvatar(r,{faceSize:512,shadows:false});a.root.rotation.y=c.turn;scene.add(a.root);const anim=createAvatarAnimator(a);if(c.pose)anim.play(c.pose);for(let i=0;i<50;i++)anim.update(1/60,{speed:0,seated:c.seated,seatHeight:.45,expression:c.mood});a.paintFace({expression:c.mood,blink:0});a.root.updateMatrixWorld(true);
if(c.seated){const bench=new THREE.Mesh(new THREE.BoxGeometry(.9,.07,.45),new THREE.MeshStandardMaterial({color:0x9b704b}));bench.position.set(0,.415,0);scene.add(bench);}
const box=new THREE.Box3().setFromObject(a.root,true),centre=box.getCenter(new THREE.Vector3());const cam=new THREE.PerspectiveCamera(28,c.w/c.h,.01,30),height=box.max.y-box.min.y;const dist=Math.max(height/2/Math.tan(14*Math.PI/180),(box.max.x-box.min.x)/2/Math.tan(14*Math.PI/180)/(c.w/c.h))*1.19;cam.position.set(0,centre.y+.04,dist);cam.lookAt(0,centre.y,0);renderer.setViewport(c.x,H-c.y-c.h,c.w,c.h);renderer.setScissor(c.x+4,H-c.y-c.h+4,c.w-8,c.h-8);renderer.render(scene,cam);
const label=document.createElement('div');label.className='label';label.textContent=c.label;Object.assign(label.style,{left:c.x+'px',top:c.y+'px',width:c.w+'px'});document.querySelector('#labels').append(label);
}window.__READY__=true;
</script></body></html>
