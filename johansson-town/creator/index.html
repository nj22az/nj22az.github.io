<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<title>Johansson Studio</title>
<meta name="description" content="Islanders for Johansson World are made in Johansson Studio.">
<link rel="canonical" href="https://nj22az.github.io/avatar-creator/">
<link rel="stylesheet" href="./creator.css?h=8c337527">
<link rel="stylesheet" href="../line-ui.css?h=5aa283d2">
</head>
<body class="creator-page">
<main style="max-width:32rem;margin:15vh auto;padding:0 16px;font:400 16px/1.5 system-ui,-apple-system,sans-serif">
<h1 style="font-size:1.4rem">Islanders are made in Johansson Studio</h1>
<p>The maker has moved. <a id="studio" href="/avatar-creator/">Open Johansson Studio</a>.</p>
</main>
<script type="module">
// The old maker's address. A shared islander (?r=code, or ?preset=harbour-visitor) opens in Johansson Studio, which
// is where every look is made now (src/studio-handoff.js).
import {CAST_RECIPES} from '../src/avatars/cast.js';
import {encodeRecipe} from '../src/avatars/recipe.js';
const params=new URLSearchParams(location.search),to=new URL('/avatar-creator/',location.href);
const code=params.get('r')||(params.get('preset')==='harbour-visitor'?encodeRecipe(CAST_RECIPES['Harbour visitor']):null);
if(code)to.searchParams.set('r',code);
document.getElementById('studio').href=to.href;
location.replace(to.href);
</script>
</body>
</html>
