<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cfe9ea">
<title>Shimanchu Maker · Johansson Town</title>
<meta name="description" content="Make an islander for Johansson Town, a 1997 Okinawan harbour town. Share them with a link.">
<style>html,body{margin:0;height:100%;background:#fff4dc}noscript{display:block;padding:24px;font-family:system-ui,sans-serif}</style>
</head>
<body>
<noscript>The islander maker needs JavaScript.</noscript>
<script type="module">
// A shared islander (?r=code) opens here; saving it walks you into the town as them.
import {openCreator} from '../src/avatars/creator.js';
import {playerRecipe,savePlayerRecipe} from '../src/avatars/actors.js';
import {decodeRecipe} from '../src/avatars/recipe.js';
const code=new URLSearchParams(location.search).get('r'),shared=code?decodeRecipe(code):null;
// Voice blips for the maker's own page; in the town they go through the town's audio.
let audio=null;
const voice=(freq,type)=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.1);}catch{}};
openCreator({
 recipe:shared||playerRecipe(),
 startAt:shared?'hello':'start',voice,
 saveLabel:'Walk the town as them',
 shareLink:c=>new URL('./?r='+c,location.href).href,
 onSave:recipe=>{savePlayerRecipe(recipe);},
 onClose:()=>{location.href='../';},
});
</script>
</body>
</html>
