<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete equipment record review</title><style>body{font:14px system-ui;background:#eee;margin:16px}button{min-height:44px;padding:10px;margin:0 8px 12px 0}iframe{display:block;border:1px solid #aaa;background:#fff;height:900px;max-width:none}output{display:block;padding:12px}</style><h1>Complete equipment record review</h1><p>CSS viewport and synthetic file tests. Uses the browser's current planner workspace; no workspace is replaced. Any saved QA records must be clearly labelled.</p><button onclick="document.querySelector('iframe').style.width='390px'">390 px phone</button><button onclick="document.querySelector('iframe').style.width='768px'">768 px tablet</button><button onclick="document.querySelector('iframe').style.width='1280px'">1280 px desktop</button><button id="qa-file">Select synthetic QA attachment in open document form</button><button id="qa-verify">Verify retained QA bytes and archive round trip</button><output aria-live="polite" id="result"></output><iframe title="Complete record review viewport" src="../?v=2026.11.02.9#record/demo-compressor" style="width:390px"></iframe><script type="module">
import {createFileVault,fileDigest,completeArchive,restoreArchive} from '../record-files.mjs?v=2026.11.02.9';
const contents='Synthetic maintenance QA report. Not an actual inspection certificate or equipment result.\nMeasurement A: 5 demonstration units; recorded limits: 1 to 5.\n';
const output=document.querySelector('#result');
document.querySelector('#qa-file').onclick=()=>{const input=document.querySelector('iframe').contentDocument.querySelector('#record-file');if(!input){output.textContent='Open Add document / file first.';return;}const transfer=new DataTransfer();transfer.items.add(new File([contents],'maintenance-qa-report.txt',{type:'text/plain'}));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));output.textContent='Synthetic QA attachment selected. Complete the visible document form before saving.';};
document.querySelector('#qa-verify').onclick=async()=>{try{const data=JSON.parse(document.querySelector('iframe').contentDocument.querySelector('.record-raw').textContent),file=data.records.documents.find(d=>d.file?.name==='maintenance-qa-report.txt')?.file;if(!file)throw Error('Save the synthetic QA document first.');const vault=createFileVault(),blob=await vault.get(file.id);if(!blob||await blob.text()!==contents||await fileDigest(blob)!==file.id)throw Error('Retained file verification failed.');const archive=await completeArchive(data,vault);let restored;await restoreArchive(archive,vault,x=>{restored=x;});if(restored.records.documents.find(d=>d.file?.id===file.id)===undefined)throw Error('Round-trip metadata missing.');output.textContent='PASS · retained QA bytes, SHA-256 and complete archive round trip verified. No workspace metadata was replaced.';}catch(err){output.textContent='FAIL · '+err.message;}};
</script></html>
