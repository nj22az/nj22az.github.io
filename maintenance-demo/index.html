function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('#save-state').textContent='Saved on this device'}catch{alert('Storage is unavailable or full. Export a backup before closing.')}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
const asset=id=>db.assets.find(a=>a.id===id);
const state=t=>t.unit==='hours'?(asset(t.assetId)?.meter>=Number(t.nextMeter)?'overdue':'meter'):!t.due?'review':days(t.due)<0?'overdue':days(t.due)<=30?'soon':'planned';
const status=t=>({overdue:['overdue','Overdue'],review:['review','Set first due date'],soon:['review','Due within 30 days'],planned:['','Scheduled'],meter:['blue','Meter-based']})[state(t)];
const badge=(cls,txt)=>`<span class="badge ${cls}">${e(txt)}</span>`;
const taskStatus=t=>{const s=status(t);return badge(...s)};
const ICONS={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',assets:'<path d="m12 3 9 5-9 5-9-5 9-5Z M3 8v9l9 5 9-5V8 M12 13v9"/>',equipment:'<path d="M14 6a5 5 0 0 0-6 6l-5 5a3 3 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-3 3-4-4 3-3Z"/>',programme:'<rect x="5" y="4" width="15" height="17" rx="2"/><path d="M9 2v4 M9 10h7 M9 14h7 M9 18h5"/>',schedule:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4 M17 3v4 M3 11h18 M8 15h2 M14 15h2"/>',risks:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z M12 8v5 M12 17h.01"/>',issues:'<path d="M5 21V4c5-4 9 4 15 0v10c-6 4-10-4-15 0"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',plus:'<path d="M12 5v14 M5 12h14"/>',download:'<path d="M12 3v12 m-5-5 5 5 5-5 M4 16v5h16v-5"/>',upload:'<path d="M12 16V4 m-5 5 5-5 5 5 M4 16v5h16v-5"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6L16 3Z M14 5l5 5"/>',play:'<path d="m8 4 13 8-13 8V4Z"/>',print:'<path d="M6 9V3h12v6 M6 17H3v-7h18v7h-3 M6 14h12v7H6z M17 11h.01"/>',refresh:'<path d="M20 10a8 8 0 1 0-2 8 M20 3v7h-7"/>',trash:'<path d="M3 6h18 M9 6V3h6v3 M5 6l1 15h12l1-15 M10 10v7 M14 10v7"/>',close:'<path d="m6 6 12 12 M6 18 18 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6 M12 7h.01"/>',chevron:'<path d="m9 5 7 7-7 7"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',link:'<path d="m10 13 4-4 M8 15l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0 M13 9l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/>',check:'<path d="m4 12 5 5L20 6"/>',home:'<path d="m3 10 9-7 9 7 M5 9v12h5v-7h4v7h5V9"/>',settings:'<path d="m9 3-1 3-3 1-2 4 2 3v4l4 3 3-1 3 1 4-3v-4l2-3-2-4-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/>'};
function icon(name){return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name]||ICONS.programme}</svg>`}
const NAV_NAMES={overview:'Overview',assets:'Assets',equipment:'Equipment',programme:'Programme',schedule:'Schedule',risks:'Risks',issues:'Actions',history:'History'};
function actionStyle(label,fn){let clean=label.replace(/[↓↑＋×↗→]/g,'').trim();let name='chevron',only=false;
 if(label==='×')return {name:'close',text:'Close dialog',only:true};
 if(/clearDemo|removeDemo|clearAll/.test(fn)){name='trash';clean='Clear demo'}
 else if(/resetDemo|resetPrep/.test(fn)){name='refresh';clean=/resetPrep/.test(fn)?'Reset checks':'Reset demo'}
 else if(/loadDemo/.test(fn)){name='play';clean='Load demo'}
 else if(/window.print/.test(fn)){name='print';clean='Print'}
 else if(/export/.test(fn)){name='download';clean=/Backup/.test(fn)?'Backup':'Export';only=/Backup/.test(fn)}
 else if(/restore|restore-file/.test(fn)){name='upload';clean='Restore'}
 else if(/completeForm/.test(fn)){name='play';clean='Perform'}
 else if(/templatesModal|applyTemplate/.test(fn)){name='programme';clean=/applyTemplate/.test(fn)?'Apply':'Templates'}
 else if(/assetForm|equipmentForm|taskForm|issueForm|riskForm/.test(fn)){const isEdit=/^(Edit|Review)/.test(clean);name=isEdit?'edit':'plus';if(isEdit){only=true}else if(/assetForm/.test(fn))clean='Add asset';else if(/equipmentForm/.test(fn))clean='Add equipment';else if(/taskForm/.test(fn))clean='Add task';else if(/issueForm/.test(fn))clean='Add finding';else clean='Add risk'}
 else if(/go\('workpack'/.test(fn)){name='programme';clean='Work pack'}
 else if(/recordModal/.test(fn)){name='history';clean='Record'}
 if(clean==='Cancel'){name='close';only=false}
 return {name,text:clean,only};}

const titles={overview:'Overview',assets:'Asset register',programme:'Maintenance programme',schedule:'Work schedule',risks:'Risk assessments',issues:'Corrective actions',history:'Service history',settings:'Workspace & backup',detail:'Asset details'};
const nav=[['overview','▦','Overview'],['assets','▧','Asset register'],['programme','☷','Maintenance programme'],['schedule','▣','Work schedule'],['risks','◇','Risk assessments'],['issues','⚑','Corrective actions'],['history','◷','Service history']];
window.go=(v,id='')=>{view=v;selected=id;query='';filter='all';location.hash=v+(id?'/'+id:'');render()};
function render(){if(['detail','workpack'].includes(view)&&!asset(selected)){view='assets'}$('.workspace strong').innerHTML=e(db.settings.company||'My programme')+' <span>⌄</span>';const navScroll=$('#nav').scrollLeft||0;$('#nav').innerHTML=nav.map(([v])=>`<a href="#${v}" class="${view===v||(['workpack','detail'].includes(view)&&v==='assets')?'active':''}" ${view===v?'aria-current="page"':''} aria-label="${e(titles[v])}">${icon(v)}<span class="nav-label">${NAV_NAMES[v]}${v==='issues'&&db.issues.filter(x=>x.status!=='Closed').length?`<span class="nav-count">${db.issues.filter(x=>x.status!=='Closed').length}</span>`:''}</span></a>`).join('');$('#nav').scrollLeft=navScroll;$('#app').innerHTML=demoBanner()+pages[view]();bindSearch();labelTables()}
const heading=(over,title,sub,buttons='')=>`<div class="page-head"><div><div class="eyebrow">${over}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`;
const btn=(label,fn,cls='')=>{const a=actionStyle(label,fn);return `<button class="${cls} ui-action${a.only?' icon-only':''}" type="button" onclick="${fn}" title="${e(label==='×'?'Close dialog':label)}" aria-label="${e(label==='×'?'Close dialog':label)}">${icon(a.name)}<span class="${a.only?'sr-only':'button-label'}">${e(a.text)}</span></button>`};
const card=(title,sub,body,action='')=>`<section class="card"><div class="card-head"><div class="card-heading"><h2>${title}</h2>${sub?`<details class="section-help print-expand"><summary title="Section information" aria-label="About ${e(title)}">${icon('info')}</summary><p>${sub}</p></details>`:''}</div>${action}</div>${body}</section>`;
const empty=(title,desc,button='')=>`<div class="empty"><strong>${title}</strong><p>${desc}</p>${button?'<div style="margin-top:18px">'+button+'</div>':''}</div>`;
const toolbar=(placeholder,options='')=>`<div class="toolbar"><input id="search" aria-label="Search" placeholder="⌕  ${placeholder}" value="${e(query)}">${options?`<select id="filter" aria-label="Filter">${options}</select>`:''}</div>`;
function bindSearch(){if($('#search'))$('#search').oninput=x=>{query=x.target.value;refreshList()};if($('#filter')){$('#filter').value=filter;$('#filter').onchange=x=>{filter=x.target.value;refreshList()}}}
function refreshList(){let p=$('#results');if(p){p.innerHTML=view==='assets'?assetRows():view==='equipment'?equipmentRows():taskRows();labelTables()}}
const match=(...s)=>s.join(' ').toLowerCase().includes(query.toLowerCase());
function sortedTasks(items){return [...items].sort((a,b)=>{const order={overdue:0,soon:1,review:2,meter:3,planned:4};return order[state(a)]-order[state(b)]||(a.due||'9999').localeCompare(b.due||'9999')})}
function taskTable(items,limit){const arr=sortedTasks(items);const shown=limit?arr.slice(0,limit):arr;return shown.length?`<div class="tablewrap"><table><thead><tr><th>Maintenance task</th><th>Asset</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody>${shown.map(t=>`<tr><td><strong>${e(t.title)}</strong><small>Every ${e(t.interval)} ${e(t.unit)} · ${e(t.owner||'Unassigned')}</small></td><td><button class="link" onclick="go('detail','${t.assetId}')">${e(asset(t.assetId)?.name||'Unknown asset')}</button><small>${e(asset(t.assetId)?.tag)}</small></td><td>${t.unit==='hours'?e(t.nextMeter)+' h':date(t.due)}<small>${t.due&&days(t.due)<0?Math.abs(days(t.due))+' days overdue':e(t.priority)+' priority'}</small></td><td>${taskStatus(t)}</td><td>${btn('Perform →',`completeForm('${t.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div>${limit?`<div class="table-foot"><span>${shown.length} of ${arr.length} tasks</span><a href="#schedule">View work schedule →</a></div>`:''}`:empty('No maintenance tasks yet','Build a programme by adding your first asset and its maintenance tasks.',btn('Create a task',"taskForm()",'primary'))}
function overview(){const over=db.tasks.filter(t=>state(t)==='overdue').length,soon=db.tasks.filter(t=>state(t)==='soon').length,open=db.issues.filter(i=>i.status!=='Closed').length;return heading('MAINTENANCE DESK','Overview','',btn('Export backup','exportBackup()')+btn('Add asset','assetForm()','primary'))+`<div class="stats icon-stats">${[['Assets',db.assets.length,'assets',"go('assets')",''],['Overdue',over,'history',"go('schedule');filter='overdue';render()",'red'],['Due soon',soon,'schedule',"go('schedule');filter='soon';render()",'orange'],['Open actions',open,'issues',"go('issues')",'']].map(([label,n,i,fn,cls])=>`<button class="stat" onclick="${fn}">${icon(i)}<strong class="${cls}">${n}</strong><span>${label}</span></button>`).join('')}</div>`+card('Due work','Outstanding and upcoming maintenance, ordered by urgency.',taskTable(db.tasks,6),'<a class="textbtn" href="#schedule">Schedule →</a>')+card('Assets','Open a work pack to prepare or perform maintenance.',db.assets.length?assetTable(db.assets.slice(0,4)):empty('Add your first asset','Or explore a fictional sample programme.',btn('Load demo','loadDemo()','primary')),'<a class="textbtn" href="#assets">View all →</a>')}

function assetTable(arr){return `<div class="asset-tiles">${arr.map(a=>{const ts=db.tasks.filter(t=>t.assetId===a.id),over=ts.filter(t=>state(t)==='overdue').length;return `<article class="asset-tile"><div class="asset-tile-head">${icon('assets')}<div><h3>${e(a.name)}</h3><p>${e(a.tag||'No tag')} · ${e(a.type)}</p></div></div><p class="asset-tile-location">${icon('pin')}${e(a.location||'Location not recorded')}</p><div class="asset-tile-bottom">${badge(over?'overdue':ts.length?'':'review',over?over+' overdue':ts.length+' tasks')}<div class="actions">${btn('Edit asset',`assetForm('${a.id}')`,'small')}${btn('Work pack',`go('workpack','${a.id}')`,'primary small')}</div></div></article>`}).join('')}</div>`}

function assetRows(){let arr=db.assets.filter(a=>match(a.name,a.tag,a.type,a.location,a.serial)&&(filter==='all'||a.location===filter));return arr.length?assetTable(arr):empty('No matching assets','Add an asset or adjust your search.')}
function assets(){return heading('EQUIPMENT & SYSTEMS','Asset register','The technical objects covered by your maintenance programme.',btn('＋ Add asset','assetForm()','primary'))+card('All assets',db.assets.length+' registered objects',toolbar('Search name, tag, serial or location','<option value="all">All locations</option>'+[...new Set(db.assets.map(a=>a.location).filter(Boolean))].sort().map(l=>`<option value="${e(l)}">${e(l)}</option>`).join(''))+'<div id="results">'+assetRows()+'</div>')}
function taskRows(){let arr=db.tasks.filter(t=>match(t.title,asset(t.assetId)?.name,t.owner,asset(t.assetId)?.tag)&&(filter==='all'||state(t)===filter));return taskTable(arr)}
function programme(){return heading('PLANNED MAINTENANCE',view==='schedule'?'Work schedule':'Maintenance programme',view==='schedule'?'Review due work and perform maintenance with a recorded checklist.':'Define what needs to be done, how often, and by whom.',btn('Print programme','window.print()')+btn('Templates','templatesModal()')+btn('＋ Add task','taskForm()','primary'))+card('Recurring maintenance',`${db.tasks.length} tasks · Calendar and operating-hour schedules`,toolbar('Search task, asset or assignee','<option value="all">All statuses</option><option value="overdue">Overdue</option><option value="soon">Due within 30 days</option><option value="review">Needs scheduling</option><option value="planned">Scheduled</option><option value="meter">Meter-based</option>')+'<div id="results">'+taskRows()+'</div>')}
function detail(){let a=asset(selected);let ts=db.tasks.filter(t=>t.assetId===a.id);return heading('ASSET RECORD',e(a.name),e(a.tag||'No tag')+' · '+e(a.location||'Unspecified location'),`<a class="btn primary" href="#workpack/${a.id}">Open work pack</a>`+btn('Edit asset',`assetForm('${a.id}')`)+btn('＋ Add task',`taskForm('','${a.id}')`,'primary'))+`<div class="detail-grid">${card('Technical particulars','Identity and operating information',`<div class="card-body"><div class="kv">${[['Asset type',a.type],['Manufacturer',a.manufacturer],['Model',a.model],['Serial number',a.serial],['Year',a.year],['Owner',a.owner],['Operating hours',a.meter+' h'],['Inspection due',date(a.inspectionDue)],['Pressure',a.pressure],['Temperature',a.temperature],['Power',a.power],['Capacity',a.capacity]].map(([l,v])=>`<div><label>${l}</label><b>${e(v||'—')}</b></div>`).join('')}</div><p style="margin-top:22px;font-size:14px;white-space:pre-wrap">${e(a.notes)}</p></div>`)}${card('Maintenance summary','Coverage for this asset',`<div class="card-body"><div class="flowline"><span>Recurring tasks</span><b>${ts.length}</b></div><div class="flowline"><span>Overdue</span><b class="red">${ts.filter(t=>state(t)==='overdue').length}</b></div><div class="flowline"><span>Completion records</span><b>${db.history.filter(h=>h.assetId===a.id).length}</b></div><div class="flowline"><span>Open corrective actions</span><b>${db.issues.filter(i=>i.assetId===a.id&&i.status!=='Closed').length}</b></div>${btn('Apply a task template',`templatesModal('${a.id}')`)}<p style="font-size:13px;margin-top:22px">Update operating hours in the asset record to evaluate meter-based tasks.</p></div>`)}</div>${card('Maintenance tasks','Open a task to edit its procedure or interval.',ts.length?`<div class="card-body">${ts.map(t=>`<div class="flowline"><div><button class="link" onclick="taskForm('${t.id}')">${e(t.title)}</button><p style="font-size:13px">Every ${t.interval} ${t.unit} · ${t.unit==='hours'?t.nextMeter+' h':date(t.due)}</p></div><div class="actions">${taskStatus(t)}${btn('Perform',`completeForm('${t.id}')`,'small')}</div></div>`).join('')}</div>`:empty('No maintenance tasks assigned','Add a task or apply a template.'))}`}
function risks(){return heading('ASSESS & CONTROL','Risk assessments','Record hazards, existing safeguards and further controls for each asset.',btn('＋ Add assessment','riskForm()','primary'))+`<div class="grid-main"><div>${card('Recorded assessments','Likelihood × consequence · 1–25',db.risks.length?`<div class="card-body">${db.risks.map(r=>`<div class="flowline"><div><button class="link" onclick="riskForm('${r.id}')">${e(r.hazard)}</button><p style="font-size:13px">${e(asset(r.assetId)?.name)} · ${e(r.category)}</p><p style="font-size:14px">${e(r.controls)}</p></div>${badge(r.likelihood*r.consequence>=15?'overdue':r.likelihood*r.consequence>=6?'review':'',r.likelihood*r.consequence+' / 25')}</div>`).join('')}</div>`:empty('No assessments recorded','Identify hazards and define controls before setting maintenance intervals.'))}</div><div>${card('Risk matrix','Likelihood × consequence',`<div class="card-body"><div class="risk-matrix">${[5,4,3,2,1].map(l=>[1,2,3,4,5].map(c=>`<div class="risk-cell" style="background:${l*c>=15?'#f2dcd4':l*c>=6?'#f2ecd4':'#e8efdc'}">${l*c}</div>`).join('')).join('')}</div><p style="font-size:13px">Likelihood increases upwards. Consequence increases to the right.</p><div class="legend">1–5: Low · 6–14: Moderate · 15–25: High</div><p style="font-size:13px">These are programme screening bands. Set controls and review decisions using your organisation’s approved method.</p></div>`)}</div></div>`}
function issues(){return heading('FINDINGS & FOLLOW-UP','Corrective actions','Track defects from discovery through to documented resolution.',btn('＋ Report finding','issueForm()','primary'))+card('Action register','Open findings remain visible until resolved.',db.issues.length?`<div class="tablewrap"><table><thead><tr><th>Finding / asset</th><th>Owner</th><th>Target date</th><th>Priority</th><th>Status</th></tr></thead><tbody>${db.issues.map(i=>`<tr><td><button class="link" onclick="issueForm('${i.id}')">${e(i.title)}</button><small>${e(asset(i.assetId)?.name)}</small></td><td>${e(i.owner||'Unassigned')}</td><td>${date(i.due)}</td><td>${badge(i.priority==='High'?'overdue':'review',i.priority)}</td><td>${badge(i.status==='Closed'?'':'review',i.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('No corrective actions','Findings reported during maintenance will appear here.'))}
function history(){return heading('COMPLETED WORK','Service history','A record of completed work, observations and checklist results.',btn('↓ Export CSV','exportHistory()')+btn('Print','window.print()'))+card('Completion records',db.history.length+' recorded maintenance events',db.history.length?`<div class="tablewrap"><table><thead><tr><th>Task / asset</th><th>Completed</th><th>Performed by</th><th>Result</th><th></th></tr></thead><tbody>${[...db.history].reverse().map(h=>`<tr><td><strong>${e(h.title)}</strong><small>${e(h.assetName)}</small></td><td>${date(h.date)}</td><td>${e(h.by)}</td><td>${badge(h.result==='Defect found'?'overdue':'',h.result)}</td><td>${btn('View record',`recordModal('${h.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div>`:empty('No completed work yet','Perform a scheduled task to create its first service record.'))}
function settings(){return heading('ADMINISTRATION','Workspace & backup','Manage your programme details and retain a portable copy of your records.')+`<div class="detail-grid">${card('Programme details','Personalise your workspace.',`<form class="form" id="settings-form">${field('Programme / organisation','company',db.settings.company,true)}${field('Default site','site',db.settings.site)}${field('Programme coordinator','coordinator',db.settings.coordinator)}<div class="form-actions"><button class="primary">Save details</button></div></form>`)}${card('Data & portability','Your records are stored in this browser on this device.',`<div class="card-body"><p>Export a JSON backup to retain the complete programme or transfer it to another device. Restoring a backup replaces this browser’s workspace.</p><div class="actions" style="margin:22px 0">${btn('↓ Export backup','exportBackup()','primary')}${btn('↑ Restore backup',"document.querySelector('#restore-file').click()")}</div><input id="restore-file" type="file" accept="application/json,.json" hidden><p style="font-size:14px">${db.assets.length} assets · ${db.tasks.length} tasks · ${db.history.length} completion records · ${db.equipment.length} equipment items</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Sample programme</h3><p style="font-size:14px">Try a fictional workshop with scheduled tasks, checklist results, risks and a corrective action. Existing assets are preserved.</p><div class="actions" style="margin:16px 0 24px">${btn('Load demo','loadDemo()')}${db.assets.some(a=>a.demo)?btn('Reset demo','resetDemo()')+btn('Clear demo data','clearDemo()'):''}</div><h3>About this programme</h3><p style="font-size:14px">An independent English maintenance workflow based on a generic maintenance workflow: asset registration, risk assessment, recurring maintenance, checklists and corrective actions. No equipment records, macros or proprietary template text are included. Procedures and intervals are set by the user.</p></div>`)}</div>`}
const pages={overview,assets,programme,schedule:programme,detail,risks,issues,history,settings};
function modal(title,body){$('#modal-body').innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2>${btn('×',"document.querySelector('#modal').close()")}</div>${body}`;$('#modal').setAttribute('aria-labelledby','dialog-title');$('#modal').querySelector('.modal-head button').setAttribute('aria-label','Close dialog');$('#modal').showModal()}
function field(label,name,value='',required=false,type='text',full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}${required?' *':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${e(value)}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function select(label,name,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>{let [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${e(v)}" ${v===value?'selected':''}>${e(l)}</option>`}).join('')}</select></div>`}
function area(label,name,value=''){return `<div class="field full"><label for="f-${name}">${label}</label><textarea name="${name}" id="f-${name}">${e(value)}</textarea></div>`}
function form(content,onsubmit,extra=''){return `<form class="form" id="edit-form"><div class="form-grid">${content}</div><div class="form-actions">${extra}${btn('Cancel',"document.querySelector('#modal').close()") }<button type="submit" class="primary">Save</button></div></form>`}

const assetOptions=()=>db.assets.map(a=>[a.id,a.name+' · '+a.tag]);

tus:'Open',resolution:'',reported:d.date});if(d.result!=='Not applicable'){if(t.unit==='hours'){asset(t.assetId).meter=Number(d.meter);t.nextMeter=Number(d.meter)+Number(t.interval)}else t.due=nextDate(d.date,t.interval,t.unit)}save();$('#modal').close();render();toast(d.result==='Not applicable'?'Recorded without advancing the schedule.':'Completion saved; next service due point updated.')}};

function download(content,type,name){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function validBackup(d){if(!validWorkpackData(d))return false;if(d?.version!==1||!d.settings||typeof d.settings.company!=='string')return false;for(let k of ['assets','tasks','history','issues','risks'])if(!Array.isArray(d[k])||d[k].some(x=>!x||typeof x.id!=='string'||!/^[\w-]+$/.test(x.id)))return false;const ids=new Set(d.assets.map(a=>a.id));if(ids.size!==d.assets.length)return false;if(d.assets.some(a=>typeof a.name!=='string'||typeof a.tag!=='string'))return false;if(d.tasks.some(t=>!ids.has(t.assetId)||typeof t.title!=='string'||!(t.interval>0)||!['days','months','years','hours'].includes(t.unit)||!Array.isArray(t.checklist)||t.checklist.some(c=>typeof c!=='string')))return false;if([...d.issues,...d.risks].some(x=>!ids.has(x.assetId)))return false;return true}

function validWorkpackData(d){if(!d||!Array.isArray(d.assets)||!Array.isArray(d.tasks))return false;const aids=new Set(d.assets.map(a=>a?.id)),items=d.equipment??[],preps=d.preparations??[];if(!Array.isArray(items)||!Array.isArray(preps))return false;const ids=new Set(items.map(r=>r?.id));if(ids.size!==items.length)return false;const safeId=id=>typeof id==='string'&&/^[\w-]+$/.test(id);if(items.some(r=>!r||!safeId(r.id)||typeof r.name!=='string'||typeof r.tag!=='string'||!['Tool','Instrument','Spare','Consumable'].includes(r.type)||!['Available','In use','Unavailable'].includes(r.status)||!Array.isArray(r.assetIds)||r.assetIds.some(id=>!aids.has(id))||(r.due&&(!/^\d{4}-\d{2}-\d{2}$/.test(r.due)||!Number.isFinite(Date.parse(r.due))))))return false;if(new Set(items.map(r=>r.tag.trim().toLowerCase())).size!==items.length)return false;if(d.tasks.some(t=>!t||t.equipmentIds!==undefined&&(!Array.isArray(t.equipmentIds)||t.equipmentIds.some(id=>!ids.has(id)))))return false;if(preps.some(p=>!p||!safeId(p.id)||!aids.has(p.assetId)||!Array.isArray(p.checks)||p.checks.some(k=>typeof k!=='string'||!(['procedure','isolation','coordination'].includes(k)||(k.startsWith('equipment:')&&ids.has(k.slice(10)))))))return false;return new Set(preps.map(p=>p.assetId)).size===preps.length}

function normaliseWorkspace(data){data.equipment??=[];data.preparations??=[];return data}
function equipmentFor(aid){const tids=new Set(db.tasks.filter(t=>t.assetId===aid).flatMap(t=>t.equipmentIds||[]));return db.equipment.filter(r=>(r.assetIds||[]).includes(aid)||tids.has(r.id))}
function usersOf(r){return db.assets.filter(a=>(r.assetIds||[]).includes(a.id)||db.tasks.some(t=>t.assetId===a.id&&(t.equipmentIds||[]).includes(r.id)))}
function equipmentFlags(r){const f=[];if(r.status!=='Available')f.push(r.status||'Availability not set');if(!r.location)f.push('Collection location missing');if(r.type==='Instrument'&&!r.due)f.push('Calibration due date missing');if(r.due&&days(r.due)<0)f.push('Inspection / calibration overdue');return f}
function prepRecord(aid){return db.preparations.find(p=>p.assetId===aid)}
function packFindings(aid){const a=asset(aid),ts=db.tasks.filter(t=>t.assetId===aid),rs=equipmentFor(aid),out=[];if(!a)return out;
 const add=(text,action)=>out.push({text,action});
 if(!a.location)add('Asset location is missing.',`assetForm('${aid}')`);
 if(!ts.length)add('No maintenance jobs are assigned.',`taskForm('','${aid}')`);
 for(const t of ts){if(!t.instructions?.trim())add(`${t.title}: work instructions / acceptance criteria are missing.`,`taskForm('${t.id}')`);if(!t.owner?.trim())add(`${t.title}: no assigned person.`,`taskForm('${t.id}')`);if(t.unit!=='hours'&&!t.due)add(`${t.title}: first due date is missing.`,`taskForm('${t.id}')`);if(t.unit==='hours'&&!(Number(t.nextMeter)>=0&&String(t.nextMeter).trim()))add(`${t.title}: operating-hour due point is missing.`,`taskForm('${t.id}')`)}
 if(!rs.length)add('No required tools or equipment have been recorded. Confirm whether any are needed.',`taskForm('${ts[0]?.id||''}','${aid}')`);
 for(const r of rs)for(const f of equipmentFlags(r))add(`${r.name}: ${f.toLowerCase()}.`,`equipmentForm('${r.id}')`);
 return out}
function resourceCard(r,aid=''){const linked=usersOf(r),f=equipmentFlags(r);return `<article class="resource-item"><div class="pack-item-head"><div><h3>${e(r.name)}</h3><p>${e(r.tag)} · ${e(r.type)}</p></div>${badge(f.length?'review':'',f.length?'Review required':r.status)}</div><div class="pack-facts"><p><b>${icon('pin')} Location</b> ${e(r.location||'Not recorded')}</p><p><b>${icon('check')} Status</b> ${e(r.status)}</p><p><b>${icon('schedule')} Due</b> ${r.due?date(r.due):r.type==='Instrument'?'Not recorded':'Not specified'}</p></div>${f.length?`<p class="pack-warning">${f.map(e).join(' · ')}</p>`:''}${r.notes?`<details class="resource-notes print-expand"><summary>${icon('info')} Notes</summary><p class="pack-copy">${e(r.notes)}</p></details>`:''}<p class="pack-copy"><b>${icon('link')} ${linked.length>1?'Shared · '+linked.length+' assets':'Assets'}</b></p><div class="actions">${linked.map(a=>`<a class="btn small" href="#workpack/${a.id}" ${a.id===aid?'aria-current="page"':''}>${e(a.tag)}${a.id===aid?' · this asset':''}</a>`).join('')||'<span>No asset links recorded</span>'}${btn('Edit equipment',`equipmentForm('${r.id}')`,'small')}</div></article>`}
function equipmentRows(){const items=db.equipment.filter(r=>match(r.name,r.tag,r.location,...usersOf(r).map(a=>a.name))&&(filter==='all'||(filter==='shared'?usersOf(r).length>1:filter==='review'?equipmentFlags(r).length>0:r.status===filter)));return items.length?`<div class="resource-grid">${items.map(r=>resourceCard(r)).join('')}</div>`:empty('No matching equipment','Add a tool, instrument, spare or consumable, then link it to the assets that need it.',btn('Add equipment','equipmentForm()','primary'))}
function equipmentPage(){return heading('PREPARE THE WORK','Shared equipment','One record per physical item. Link tools and instruments to multiple assets or individual jobs.',btn('＋ Add equipment','equipmentForm()','primary'))+card('Equipment register',`${db.equipment.length} items · Collection locations and availability`,toolbar('Find equipment, location or linked asset','<option value="all">All equipment</option><option value="shared">Shared across assets</option><option value="review">Needs review</option><option value="Available">Available</option><option value="In use">In use</option><option value="Unavailable">Unavailable</option>')+'<div id="results">'+equipmentRows()+'</div>')}
function invalidatePreparation(aids){const ids=new Set(aids);db.preparations=db.preparations.filter(p=>!ids.has(p.assetId))}
const prepChecks=[['procedure','Procedure and acceptance criteria reviewed'],['isolation','Isolation and site permissions confirmed'],['coordination','Shared equipment use coordinated']];
function openFindings(aid){const items=db.issues.filter(i=>i.assetId===aid&&i.status!=='Closed');return card('Outstanding findings','Review unresolved defects associated with this asset.',items.length?`<div class="card-body">${items.map(i=>`<div class="pack-finding"><h3>${e(i.title)}</h3><p>${e(i.details)}</p><p class="pack-copy">${e(i.priority)} priority · ${e(i.status)}</p>${btn('Review finding',`issueForm('${i.id}')`,'small')}</div>`).join('')}</div>`:'<div class="card-body"><p>No open corrective actions recorded for this asset.</p></div>')}
function workpack(){const a=asset(selected);if(!a)return empty('Asset not found','Select an asset from the register.','<a class="btn" href="#assets">Open asset register</a>');const ts=sortedTasks(db.tasks.filter(t=>t.assetId===a.id)),rs=equipmentFor(a.id),findings=packFindings(a.id),prep=prepRecord(a.id),checked=new Set(prep?.checks||[]);const choices=[...prepChecks,...rs.map(r=>['equipment:'+r.id,`${r.tag} · ${r.name} · checked`])];const count=choices.filter(([key])=>checked.has(key)).length;
 return heading('ASSET WORK PACK',e(a.name),`${e(a.tag)} · ${e(a.location||'Location not recorded')}`,`<a class="btn" href="#detail/${a.id}">Asset details</a>`+btn('Print work pack','window.print()','primary'))+`<div class="pack-summary"><div><b>${ts.length}</b><span>${icon('programme')} Jobs</span></div><div><b>${rs.length}</b><span>${icon('equipment')} Equipment</span></div><div><b>${findings.length}</b><span>${icon('risks')} Review</span></div><div><b>${count} / ${choices.length}</b><span>${icon('check')} Checks</span></div></div>`+
 card('Confirm before work','Review these records and resolve uncertainties before planning the visit.',findings.length?`<ul class="pack-findings">${findings.map(f=>`<li><span>${e(f.text)}</span>${btn('Review',f.action,'small')}</li>`).join('')}</ul>`:'<div class="card-body"><p>No missing details were found by the preparation checks. Confirm the current site conditions and approved procedure before work.</p></div>')+
 `<div class="pack-columns"><div>${card('Jobs on this asset','Procedures, due points and linked equipment in one place.',ts.length?ts.map(t=>`<section class="pack-task"><div class="pack-item-head"><h3>${e(t.title)}</h3>${taskStatus(t)}</div><p>Every ${e(t.interval)} ${e(t.unit)} · ${t.unit==='hours'?e(t.nextMeter)+' h':date(t.due)} · ${e(t.owner||'Unassigned')}</p><details class="job-procedure print-expand"><summary>${icon('programme')} Procedure ${icon('chevron')}</summary><p class="pack-copy">${e(t.instructions||'Work instructions have not been recorded.')}</p><ol class="pack-list">${(t.checklist||[]).map(c=>`<li>${e(c)}</li>`).join('')||'<li>No checklist recorded.</li>'}</ol><p class="pack-copy"><b>Job equipment:</b> ${(t.equipmentIds||[]).map(id=>e(db.equipment.find(r=>r.id===id)?.name||'Missing equipment record')).join(', ')||'Review the asset equipment list.'}</p></details><div class="actions">${btn('Edit job',`taskForm('${t.id}')`,'small')}${btn('Perform maintenance',`completeForm('${t.id}')`,'primary small')}</div></section>`).join(''):empty('No jobs assigned','Define a maintenance task to build this work pack.',btn('Add task',`taskForm('','${a.id}')`)))}
 ${card('Required equipment','Confirm collection locations and coordinate any shared items.',rs.length?`<div class="resource-grid pack-resource-list">${rs.map(r=>resourceCard(r,a.id)).join('')}</div>`:empty('Equipment requirements not recorded','Add equipment to a job or link it directly to this asset.',btn('Add equipment',`equipmentForm('','${a.id}')`)))}</div><div>${card('Preparation checklist','Checks are saved for this asset. Editing its jobs or equipment clears affected confirmations.',`<div class="card-body"><p>${count} of ${choices.length} checks confirmed${prep?.updatedAt?' · Updated '+e(new Date(prep.updatedAt).toLocaleDateString('en-GB')):''}</p>${choices.map(([key,label])=>`<label class="check"><input type="checkbox" ${checked.has(key)?'checked':''} onchange="setPrep('${a.id}','${key}',this.checked)"><span>${e(label)}</span></label>`).join('')}<div class="actions pack-copy">${btn('Reset preparation',`resetPrep('${a.id}')`,'small')}</div><p class="pack-copy">A preparation record supports planning. It does not authorise work or replace the approved procedure.</p></div>`) }${openFindings(a.id)}</div></div>`}
window.setPrep=(aid,key,value)=>{if(!asset(aid))return;let p=prepRecord(aid);if(!p){p={id:uid(),assetId:aid,checks:[]};db.preparations.push(p)}p.checks=[...new Set(value?[...p.checks,key]:p.checks.filter(k=>k!==key))];p.updatedAt=new Date().toISOString();save();render()};
window.resetPrep=aid=>{if(!confirm('Clear preparation confirmations for this asset? Maintenance completion records are retained.'))return;db.preparations=db.preparations.filter(p=>p.assetId!==aid);save();render()};
function multiChoices(label,name,items,chosen=[]){return `<fieldset class="field full pack-choices"><legend>${e(label)}</legend>${items.length?items.map(([id,label])=>`<label class="check"><input type="checkbox" name="${name}" value="${e(id)}" ${chosen.includes(id)?'checked':''}><span>${e(label)}</span></label>`).join(''):'<p>No records available yet.</p>'}</fieldset>`}
window.equipmentForm=(id='',aid='')=>{const r=db.equipment.find(r=>r.id===id)||{status:'Available',type:'Tool',assetIds:aid?[aid]:[]};modal(id?'Edit shared equipment':'Register shared equipment',form(field('Equipment name','name',r.name,true)+field('Unique equipment tag','tag',r.tag,true)+select('Item type','type',['Tool','Instrument','Spare','Consumable'],r.type)+field('Collection location','location',r.location)+select('Availability','status',['Available','In use','Unavailable'],r.status)+field('Inspection / calibration due','due',r.due,false,'date')+area('Collection / coordination notes','notes',r.notes)+multiChoices('Required by these assets','assetIds',assetOptions(),r.assetIds)));
 wire((d,fd)=>{const oldUsers=id?usersOf(r).map(a=>a.id):[];d.tag=d.tag.trim();d.name=d.name.trim();if(!d.tag||!d.name)throw Error('Name and tag are required');if(db.equipment.some(x=>x.id!==id&&x.tag.toLowerCase()===d.tag.toLowerCase())){alert('Use a unique equipment tag.');throw Error('Duplicate equipment tag')}d.assetIds=fd.getAll('assetIds');invalidatePreparation([...oldUsers,...d.assetIds]);if(id)Object.assign(r,d);else db.equipment.push({...d,id:uid()})})};
function clearDemoRecords(){const aids=new Set(db.assets.filter(a=>a.demo).map(a=>a.id)),eids=new Set(db.equipment.filter(r=>r.demo).map(r=>r.id));for(const k of ['assets','tasks','risks','issues','history','preparations'])db[k]=db[k].filter(r=>!r.demo&&!aids.has(k==='assets'?r.id:r.assetId));db.equipment=db.equipment.filter(r=>!r.demo);for(const r of db.equipment)r.assetIds=(r.assetIds||[]).filter(id=>!aids.has(id));for(const t of db.tasks)t.equipmentIds=(t.equipmentIds||[]).filter(id=>!eids.has(id));for(const p of db.preparations)p.checks=p.checks.filter(key=>!key.startsWith('equipment:')||!eids.has(key.slice(10)));db.demoDismissed=true}
window.clearDemo=()=>{if(!confirm('Clear all demonstration assets, jobs, equipment, preparation checks and linked records? Separately created records are retained.'))return;clearDemoRecords();save();go('overview');toast('Demonstration data cleared. Separately created records retained.')};
window.removeDemo=window.clearDemo;
const baseLoadDemo=window.loadDemo;
window.loadDemo=()=>{baseLoadDemo();addDemoEquipment();save();render()};
window.resetDemo=()=>{if(!confirm('Reset the fictional demonstration programme? Changes to demonstration assets and their linked records will be removed. Separately created records are retained.'))return;clearDemoRecords();window.loadDemo();go('overview');toast('Demonstration programme reset')};
function addDemoEquipment(){if(!db.assets.some(a=>a.id==='demo-pump'&&a.demo))return;const shift=n=>nextDate(today(),n,'days');const samples=[
 {id:'demo-kit-pressure',tag:'DEMO-E01',name:'Portable pressure reference kit',type:'Instrument',location:'Workshop · Instrument cabinet',status:'Available',due:shift(120),assetIds:['demo-pump','demo-compressor'],notes:'Fictional shared item. Coordinate collection before either job.'},
 {id:'demo-kit-meter',tag:'DEMO-E02',name:'Electrical inspection meter',type:'Instrument',location:'Workshop · Tool store',status:'In use',due:shift(-7),assetIds:['demo-generator','demo-compressor'],notes:'Demonstration review case: overdue calibration and currently in use.'},
 {id:'demo-kit-lamp',tag:'DEMO-E03',name:'Portable inspection lamp',type:'Tool',location:'Workshop · Tool store',status:'Available',due:'',assetIds:['demo-generator'],notes:'Fictional inspection tool.'}
 ];for(const r of samples)if(!db.equipment.some(x=>x.id===r.id))db.equipment.push({...r,demo:true});
 const links={'demo-pump-check':['demo-kit-pressure'],'demo-compressor-drain':['demo-kit-pressure'],'demo-generator-inspect':['demo-kit-meter'],'demo-generator-test':['demo-kit-lamp']};for(const t of db.tasks)if(t.demo&&links[t.id]&&!t.equipmentIds)t.equipmentIds=links[t.id];}
titles.equipment='Shared equipment';titles.workpack='Asset work pack';pages.equipment=equipmentPage;pages.workpack=workpack;nav.splice(2,0,['equipment','⌕','Shared equipment']);
addDemoEquipment();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}

if(!db.demoDismissed&&['assets','tasks','history','issues','risks'].every(k=>db[k].length===0))window.loadDemo();


function labelTables(){document.querySelectorAll('.tablewrap table').forEach(table=>{const labels=[...table.querySelectorAll('thead th')].map(n=>n.textContent.trim());table.querySelectorAll('tbody tr').forEach(row=>[...row.children].forEach((cell,i)=>cell.setAttribute('data-label',labels[i]||'Actions')))})}
let printOpen=[];
window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('details.print-expand')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true)});
window.addEventListener('afterprint',()=>{printOpen.forEach(([d,open])=>d.open=open);printOpen=[]});

window.addEventListener('hashchange',route);route();
</script></body></html>
