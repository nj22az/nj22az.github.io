<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project status · Johansson Animation Studios</title>
  <meta name="description" content="Follow the production milestones for The Fog Never Gave Him Back.">
  <link rel="canonical" href="https://nj22az.github.io/animation-studio/project-status/">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../johansson-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="../studio.css?v=office-density-1">
  <link rel="stylesheet" href="/css/site-family.css?v=studio-status-shortcut-2">
  <link rel="stylesheet" href="status.css?v=production-milestones-2">
</head>
<body class="studio-page site-family">
  <a class="studio-skip" href="#status-content">Skip to project status</a>
  <nav id="site-nav" class="site-nav"></nav>
  <main id="status-content" class="studio-width project-status">
    <article class="status-film" aria-labelledby="film-heading">
      <div class="status-overview">
        <h1 id="film-heading">The Fog Never Gave Him Back</h1>
        <div class="status-meta">
          <p id="status-verified" hidden></p>
          <p id="status-update" role="status">Loading production status…</p>
        </div>
        <section id="status-active-job" class="status-active-job" aria-labelledby="status-active-heading" hidden>
          <h2 id="status-active-heading">Current job</h2>
          <div id="status-active-render"></div>
        </section>
        <noscript><p><a href="film-status.json">Read the current status data</a>.</p></noscript>
      </div>
      <section id="status-milestones" class="status-milestones" aria-labelledby="status-milestones-heading" hidden>
        <h2 id="status-milestones-heading">Production milestones</h2>
        <ul id="status-milestone-list" class="status-milestone-list"></ul>
      </section>
      <details id="status-details" class="status-details" hidden>
        <summary>Detailed checklist</summary>
        <p id="status-count" class="status-count"></p>
        <progress id="status-overall" max="1" value="0" aria-label="Verified checklist items"></progress>
        <div id="status-checklist" class="status-checklist" aria-label="Production checklist" aria-busy="true"></div>
      </details>
    </article>
  </main>
  <footer id="site-footer" class="site-footer"><a href="/">The Office of Nils Johansson</a></footer>
  <script src="/config.js?v=20261118-animation-studio"></script>
  <script src="/shared.js?v=studio-status-shortcut-2"></script>
  <script src="status.js?v=production-milestones-1" defer></script>
</body>
</html>
