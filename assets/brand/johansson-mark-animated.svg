<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Johansson"><title>Johansson</title><style>path{fill:none;stroke-linecap:round;stroke-linejoin:round}.i{stroke:var(--jl-ink,#3d3a37)}.a{stroke:var(--jl-accent,#3ea88c)}.s5{stroke-width:5}.s7{stroke-width:7}.s9{stroke-width:9}path{stroke-dasharray:1 1;animation-name:jl-draw;animation-timing-function:cubic-bezier(.65,0,.35,1);animation-fill-mode:both}.mark{transform-box:fill-box;transform-origin:center;animation:jl-stamp .45s cubic-bezier(.3,1.6,.5,1) 0.85s both}@keyframes jl-draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}@keyframes jl-stamp{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){path,.mark{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}</style><g class="mark"><path class="a s5" pathLength="1" d="M50 8A42 42 0 1 1 50 92A42 42 0 1 1 50 8" style="animation-delay:0.00s;animation-duration:0.85s"/><path class="a s9" pathLength="1" d="M45 30H62V57A12 12 0 0 1 38 57" style="animation-delay:0.30s;animation-duration:0.60s"/></g></svg>
